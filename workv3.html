<script src="https://sql.js.org/dist/sql-wasm.js"></script>
<script>
const GH_OWNER = "camdevelopers";
const GH_REPO = "work3";
const API = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`;
const ENC_KEY_LEN = 64;
const TABLES = ['tasks','instances','events','notes','stock','attendance'];

let db = null, SQL = null, encKey = null, deviceId = null;

// ─── Crypto (AES-GCM, format: [12-byte IV][ciphertext+tag]) ─────────────
function hexToBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
  return bytes;
}
async function encryptData(data, keyHex) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await crypto.subtle.importKey('raw', hexToBytes(keyHex), { name: 'AES-GCM' }, false, ['encrypt']);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
  const out = new Uint8Array(12 + ct.byteLength);
  out.set(iv); out.set(new Uint8Array(ct), 12);
  return out;
}
async function decryptData(encBytes, keyHex) {
  const key = await crypto.subtle.importKey('raw', hexToBytes(keyHex), { name: 'AES-GCM' }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: encBytes.slice(0, 12) }, key, encBytes.slice(12));
  return new Uint8Array(pt);
}

// ─── IndexedDB (persists SQLite blob) ───────────────────────────────────
function idbOpen() {
  return new Promise((r, j) => { const q = indexedDB.open('office-app', 1); q.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains('data')) e.target.result.createObjectStore('data'); }; q.onsuccess = e => r(e.target.result); q.onerror = () => j(q.error); });
}
async function idbGet(key) { const d = await idbOpen(); return new Promise((r, j) => { const t = d.transaction('data', 'readonly'); const q = t.objectStore('data').get(key); q.onsuccess = () => r(q.result ?? null); q.onerror = () => j(q.error); }); }
async function idbSet(key, val) { const d = await idbOpen(); return new Promise((r, j) => { const t = d.transaction('data', 'readwrite'); t.objectStore('data').put(val, key); t.oncomplete = () => r(); t.onerror = () => j(t.error); }); }

// ─── SQLite ─────────────────────────────────────────────────────────────
const SCHEMA = `
CREATE TABLE IF NOT EXISTS tasks (
  row_id INTEGER PRIMARY KEY, task_id TEXT UNIQUE, name TEXT, type TEXT,
  tdesc TEXT, config TEXT, upcoming_hrs INTEGER, current_hrs INTEGER,
  completed_days INTEGER, created_at TEXT, synced INTEGER DEFAULT 0, is_duplicate INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS instances (
  row_id INTEGER PRIMARY KEY, instance_id TEXT UNIQUE, task_id TEXT,
  due_at TEXT, status TEXT, done_at TEXT, triggered_by TEXT,
  created_at TEXT, change_number INTEGER DEFAULT 0,
  synced INTEGER DEFAULT 0, is_duplicate INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS events (
  row_id INTEGER PRIMARY KEY, task_id TEXT, instance_id TEXT,
  action TEXT, ts TEXT, note TEXT, synced INTEGER DEFAULT 0, is_duplicate INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS notes (
  row_id INTEGER PRIMARY KEY, note_id TEXT UNIQUE, text TEXT,
  done INTEGER DEFAULT 0, created_at TEXT, edited_at TEXT,
  synced INTEGER DEFAULT 0, is_duplicate INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS stock (
  row_id INTEGER PRIMARY KEY, task_id TEXT, event TEXT,
  qty INTEGER, ts TEXT, synced INTEGER DEFAULT 0, is_duplicate INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS attendance (
  row_id INTEGER PRIMARY KEY, date TEXT, checkin TEXT, checkout TEXT,
  seq INTEGER, synced INTEGER DEFAULT 0, is_duplicate INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS oplog (
  log_id INTEGER PRIMARY KEY,
  table_name TEXT,
  record_id INTEGER,
  op TEXT,
  payload TEXT,
  ts TEXT,
  synced INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS meta (
  key TEXT PRIMARY KEY, value TEXT
);
`;

async function initDB() {
  SQL = await initSqlJs({ locateFile: () => 'https://sql.js.org/dist/sql-wasm.wasm' });
  const saved = await idbGet('db_blob');
  if (saved) {
    db = new SQL.Database(new Uint8Array(saved));
  } else {
    db = new SQL.Database();
    db.run(SCHEMA);
    const devId = parseInt(localStorage.getItem('fe_device_id')) || 1;
    db.run(`INSERT INTO meta VALUES ('next_row_id', ?)`, [String(devId * 1000000 + 1)]);
    await saveDB();
  }
}

async function saveDB() {
  const data = db.export();
  await idbSet('db_blob', data.buffer);
}

// Row IDs encode device: device 1 → 1xxxxxx, device 2 → 2xxxxxx
function nextRowId() {
  const res = db.exec(`SELECT value FROM meta WHERE key='next_row_id'`);
  let id;
  if (res.length > 0 && res[0].values.length > 0) {
    id = parseInt(res[0].values[0][0]);
  } else {
    const devId = parseInt(localStorage.getItem('fe_device_id')) || 1;
    id = devId * 1000000 + 1;
  }
  db.run(`INSERT OR REPLACE INTO meta VALUES ('next_row_id', ?)`, [String(id + 1)]);
  return id;
}

// After full backup pull, recompute from this device's own max to avoid ID collision
function recomputeNextRowId() {
  const devId = parseInt(localStorage.getItem('fe_device_id')) || 1;
  const lo = devId * 1000000, hi = (devId + 1) * 1000000;
  let maxId = 0;
  for (const t of [...TABLES, 'oplog']) {
    const res = db.exec(`SELECT COALESCE(MAX(row_id),0) FROM ${t} WHERE row_id >= ${lo} AND row_id < ${hi}`);
    if (res.length > 0 && res[0].values.length > 0) maxId = Math.max(maxId, parseInt(res[0].values[0][0]) || 0);
  }
  const next = maxId > 0 ? maxId + 1 : lo + 1;
  db.run(`INSERT OR REPLACE INTO meta VALUES ('next_row_id', ?)`, [String(next)]);
}

function getMeta(key) {
  const res = db.exec(`SELECT value FROM meta WHERE key=?`, [key]);
  return res.length > 0 && res[0].values.length > 0 ? res[0].values[0][0] : null;
}
function setMeta(key, val) {
  db.run(`INSERT OR REPLACE INTO meta VALUES (?, ?)`, [key, val]);
}

// ─── Oplog: log a local change for sync ─────────────────────────────────
function logOp(tableName, recordId, op, payloadObj) {
  const logId = nextRowId();
  const ts = new Date().toISOString();
  const payload = payloadObj ? JSON.stringify(payloadObj) : null;
  db.run(`INSERT INTO oplog (log_id, table_name, record_id, op, payload, ts, synced) VALUES (?,?,?,?,?,?,0)`,
    [logId, tableName, recordId, op, payload, ts]);
  return logId;
}

// ─── Git API ────────────────────────────────────────────────────────────
function authHeaders() {
  const pat = localStorage.getItem('fe_token');
  return { 'Authorization': `Bearer ${pat}`, 'Accept': 'application/vnd.github.v3+json', 'User-Agent': 'office-pwa' };
}
async function getLatestSHA_oldway_consumesmoretraffic() {
  const res = await fetch(`${API}/commits/HEAD`, { headers: authHeaders() });
  if (res.status === 409) return null;
  if (!res.ok) throw new Error(`HEAD ${res.status}`);
  return (await res.json()).sha;
}
async function getLatestSHA() {
  const headers = authHeaders();
  const etag = getMeta('last_head_etag');
  if (etag) headers['If-None-Match'] = etag;
  const res = await fetch(`${API}/commits/HEAD`, { headers });
  if (res.status === 304) return null; // unchanged, skip everything
  if (res.status === 409) return null;
  if (!res.ok) throw new Error(`HEAD ${res.status}`);
  const sha = (await res.json()).sha;
  setMeta('last_head_etag', res.headers.get('ETag'));
  return sha;
}   
async function listDir(path) {
  const res = await fetch(`${API}/contents/${path}?ref=HEAD`, { headers: authHeaders() });
  if (res.status === 404) return [];
  if (!res.ok) throw new Error(`List ${path}: ${res.status}`);
  const files = await res.json();
  return files.filter(f => f.name.endsWith('.csv') || f.name.endsWith('.enc')).map(f => f.name);
}
async function fetchFileBytes(path) {
  const res = await fetch(`${API}/contents/${path}?ref=HEAD`, { headers: authHeaders() });
  if (!res.ok) throw new Error(`Fetch ${path}: ${res.status}`);
  const data = await res.json();
  return Uint8Array.from(atob(data.content), c => c.charCodeAt(0));
}

// Push with SHA for existing files + ghost push detection
async function pushFile(path, content, message) {
  const pat = localStorage.getItem('fe_token');
  let body;
  if (typeof content === 'string') {
    body = btoa(unescape(encodeURIComponent(content)));
  } else {
    let binary = '';
    for (let i = 0; i < content.length; i++) binary += String.fromCharCode(content[i]);
    body = btoa(binary);
  }
  let sha = null;
  try {
    const checkRes = await fetch(`${API}/contents/${path}?ref=HEAD`, { headers: authHeaders() });
    if (checkRes.ok) { const data = await checkRes.json(); sha = data.sha; }
  } catch (e) {}
  const payload = { message, content: body };
  if (sha) payload.sha = sha;
  const res = await fetch(`${API}/contents/${path}`, {
    method: 'PUT',
    headers: { 'Authorization': `Bearer ${pat}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json', 'User-Agent': 'office-pwa' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    // Ghost push: file may exist despite error. Verify before throwing.
    try {
      const verify = await fetch(`${API}/contents/${path}?ref=HEAD`, { headers: authHeaders() });
      if (verify.ok) return;
    } catch (e) {}
    const err = await res.json().catch(() => ({}));
    throw new Error(`Push ${path}: ${res.status} ${err.message || ''}`);
  }
}

// ─── Loading spinner wrapper ────────────────────────────────────────────
function withSpinner(btnId, fn) {
  const btn = document.getElementById(btnId);
  if (!btn) return fn();
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  return fn().finally(() => { btn.disabled = false; btn.innerHTML = orig; });
}

// ─── Ensure repo is ready (initial commit + first backup) ───────────────
async function ensureRepoReady() {
  // 1. If repo has no commits, push a .gitkeep to create one
  const headRes = await fetch(`${API}/commits/HEAD`, { headers: authHeaders() });
  if (headRes.status === 409) {
    await pushFile('README.md', '# work3 sync repo', 'init');
  }

  // 2. If no backup exists in repo and local DB has data, push one
  const bakFiles = await listDir('backup');
  if (!bakFiles.includes('office.sqlite.enc')) {
    const hasData = db.exec(`SELECT COUNT(*) FROM tasks`).length > 0
      && db.exec(`SELECT COUNT(*) FROM tasks`)[0].values[0][0] > 0;
    if (hasData) {
      const blob = db.export();
      const encrypted = await encryptData(blob, encKey);
      await pushFile('backup/office.sqlite.enc', encrypted, 'initial backup');
      const sha = await getLatestSHA();
      setMeta('last_backup_sha', sha || '');
      await saveDB();
    }
  }
}   

// ─── Sync: Push pending oplog entries ───────────────────────────────────
async function pushPending() {
  const res = db.exec(`SELECT log_id FROM oplog WHERE synced=0 ORDER BY log_id`);
  if (res.length === 0 || res[0].values.length === 0) { updateSyncBadge(); return 0; }
  let pushed = 0;
  for (const [logId] of res[0].values) {
    try {
      const rowRes = db.exec(`SELECT * FROM oplog WHERE log_id=?`, [logId]);
      const vals = rowRes[0].values[0];
      const csvLine = vals.join('|');
      const encrypted = await encryptData(new TextEncoder().encode(csvLine), encKey);
      await pushFile(`changes/${logId}.csv`, encrypted, `op ${logId}`);
      db.run(`UPDATE oplog SET synced=1 WHERE log_id=?`, [logId]);
      pushed++;
    } catch (e) {
      console.error(`Push oplog ${logId} failed:`, e);
      break;
    }
  }
  if (pushed > 0) await saveDB();
  updateSyncBadge();
  return pushed;
}

async function fullBackup() {
  const blob = db.export();
  const encrypted = await encryptData(blob, encKey);
  await pushFile('backup/office.sqlite.enc', encrypted, 'full backup');
  const sha = await getLatestSHA();
  setMeta('last_backup_sha', sha || '');
  await saveDB();
}

// ─── Sync: Pull (full backup or oplog deltas) ───────────────────────────
async function doPull() {
  const localSHA = getMeta('last_pull_sha') || '';
  const remoteSHA = await getLatestSHA();
  if (!remoteSHA || remoteSHA === localSHA) return 0;

  let applied = 0;

  // Full backup check
  try {
    const bakFiles = await listDir('backup');
    if (bakFiles.includes('office.sqlite.enc')) {
      const lastBak = getMeta('last_backup_sha') || '';
      if (remoteSHA !== lastBak) {
        const encBytes = await fetchFileBytes('backup/office.sqlite.enc');
        const decrypted = await decryptData(encBytes, encKey);
        db = new SQL.Database(decrypted);
        recomputeNextRowId();
        setMeta('last_pull_sha', remoteSHA);
        setMeta('last_backup_sha', remoteSHA);
        await saveDB();
        runDedupSweep();
        return -1;
      }
    }
  } catch (e) { console.warn('Backup pull:', e); }

  // Delta pull: replay oplog entries
  try {
    const files = await listDir('changes');
    for (const f of files) {
      if (!f.endsWith('.csv')) continue;
      const logId = parseInt(f.replace('.csv', ''));
      const exists = db.exec(`SELECT 1 FROM oplog WHERE log_id=?`, [logId]);
      if (exists.length > 0 && exists[0].values.length > 0) continue;

      const encBytes = await fetchFileBytes(`changes/${f}`);
      const decrypted = await decryptData(encBytes, encKey);
      const line = new TextDecoder().decode(decrypted);
      const fields = line.split('|');
      // oplog: log_id|table_name|record_id|op|payload|ts|synced
      const tbl = fields[1], recId = parseInt(fields[2]), op = fields[3], payloadJson = fields[4];

      db.run(`INSERT OR IGNORE INTO oplog (log_id, table_name, record_id, op, payload, ts, synced) VALUES (?,?,?,?,?,?,1)`,
        [logId, tbl, recId, op, payloadJson, fields[5]]);

      if (TABLES.includes(tbl)) {
        try {
          if (op === 'INSERT' || op === 'UPDATE') {
            const row = JSON.parse(payloadJson);
            const cols = Object.keys(row);
            const vals = cols.map(c => row[c] === undefined ? null : row[c]);
            const colList = cols.join(',');
            const placeholders = cols.map(() => '?').join(',');
            if (op === 'INSERT') {
              db.run(`INSERT OR IGNORE INTO ${tbl} (${colList}) VALUES (${placeholders})`, vals);
            } else {
              const setCols = cols.filter(c => c !== 'row_id');
              const setClause = setCols.map(c => `${c}=?`).join(',');
              const setVals = setCols.map(c => row[c] === undefined ? null : row[c]);
              db.run(`UPDATE ${tbl} SET ${setClause} WHERE row_id=?`, [...setVals, row.row_id]);
            }
            applied++;
          } else if (op === 'DELETE') {
            db.run(`DELETE FROM ${tbl} WHERE row_id=?`, [recId]);
            applied++;
          }
        } catch (e) { console.warn(`Replay ${logId} (${op} ${tbl}):`, e); }
      }
    }
  } catch (e) { console.warn('Delta pull:', e); }

  setMeta('last_pull_sha', remoteSHA);
  await saveDB();
  runDedupSweep();
  return applied;
}

// ─── Dedup sweep: resolve duplicate instances after pull ────────────────
// Groups pending instances by slot (anchored to latest done_at for sequence).
// Higher change_number wins; tie → earlier created_at wins. Loser → is_duplicate=1.
function runDedupSweep() {
  const tasks = getTasks();
  const instances = getInstances();
  let changed = false;

  for (const task of tasks) {
    const cfg = JSON.parse(task.config || '{}');
    const taskInsts = instances.filter(i => i.task_id === task.task_id && i.is_duplicate === 0);
    const pending = taskInsts.filter(i => i.status === 'pending' || i.status === 'doing' || i.status === 'will_do');
    if (pending.length <= 1) continue;

    const doneInsts = taskInsts.filter(i => i.status === 'done' && i.done_at);
    const lastDone = doneInsts.length > 0
      ? doneInsts.sort((a, b) => new Date(b.done_at) - new Date(a.done_at))[0]
      : null;

    const slots = {};
    for (const inst of pending) {
      let slotKey;
      if (task.type === 'sequence') {
        slotKey = getSlotKey(task, cfg, new Date(inst.due_at), lastDone);
      } else if (task.type === 'calendar') {
        slotKey = new Date(inst.due_at).toISOString().slice(0, 10);
      } else if (task.type === 'dependency') {
        slotKey = inst.triggered_by || 'unknown';
      } else {
        slotKey = 'single';
      }
      if (!slots[slotKey]) slots[slotKey] = [];
      slots[slotKey].push(inst);
    }

    for (const key of Object.keys(slots)) {
      const group = slots[key];
      if (group.length <= 1) continue;
      group.sort((a, b) => {
        if (b.change_number !== a.change_number) return b.change_number - a.change_number;
        return new Date(a.created_at) - new Date(b.created_at);
      });
      for (let i = 1; i < group.length; i++) {
        db.run(`UPDATE instances SET is_duplicate=1 WHERE row_id=?`, [group[i].row_id]);
        changed = true;
      }
    }
  }
  if (changed) saveDB();
}

window.toggleSyncPanel = function() {
  const panel = document.getElementById('sync-panel');

  panel.style.display = 'block';
  const res = db.exec(`SELECT log_id, table_name, op, ts FROM oplog WHERE synced=0 ORDER BY log_id LIMIT 20`);
  let html = '<strong>Sync Status</strong>';
  if (res.length > 0 && res[0].values.length > 0) {

window.pushSingle = async function(logId) {
  const rowRes = db.exec(`SELECT * FROM oplog WHERE log_id=?`, [logId]);
  if (!rowRes.length || !rowRes[0].values.length) return;
  const vals = rowRes[0].values[0];
  const csvLine = vals.join('|');
  const encrypted = await encryptData(new TextEncoder().encode(csvLine), encKey);
  await pushFile(`changes/${logId}.csv`, encrypted, `op ${logId}`);
  db.run(`UPDATE oplog SET synced=1 WHERE log_id=?`, [logId]);
  await saveDB();
  updateSyncBadge();
  toggleSyncPanel(); toggleSyncPanel();
};

function getTasks() {

  const cols = res[0].columns;
  return res[0].values.map(v => Object.fromEntries(cols.map((c, i) => [c, v[i]])));
}
function getInstances() {
  const res = db.exec(`SELECT * FROM instances ORDER BY due_at`);
  if (res.length === 0) return [];
  const cols = res[0].columns;
  return res[0].values.map(v => Object.fromEntries(cols.map((c, i) => [c, v[i]])));
}
function getEvents() {
  const res = db.exec(`SELECT * FROM events WHERE is_duplicate=0 ORDER BY ts`);
  if (res.length === 0) return [];
  const cols = res[0].columns;
  return res[0].values.map(v => Object.fromEntries(cols.map((c, i) => [c, v[i]])));
}
function getNotes() {
  const res = db.exec(`SELECT * FROM notes WHERE is_duplicate=0 ORDER BY created_at DESC`);
  if (res.length === 0) return [];
  const cols = res[0].columns;
  return res[0].values.map(v => Object.fromEntries(cols.map((c, i) => [c, v[i]])));

}

    const sec = document.getElementById(id);

// ─── Instance generation (with slot-key dedup guard) ────────────────────
async function generateInstances() {
  const tasks = getTasks();
  const instances = getInstances();
  let changed = false;

  for (const task of tasks) {
    if (task.type === 'attendance') continue;
    const cfg = JSON.parse(task.config || '{}');
    const taskInstances = instances.filter(i => i.task_id === task.task_id && i.is_duplicate === 0);
    const lastDone = taskInstances.filter(i => i.status === 'done' && i.done_at).sort((a, b) => new Date(b.done_at) - new Date(a.done_at))[0];
    const pending = taskInstances.filter(i => i.status === 'pending' || i.status === 'doing' || i.status === 'will_do');

    if (task.type === 'sequence') {
      if (pending.length === 0) {
        let next;
        if (lastDone) {
          next = new Date(lastDone.done_at);
          if (cfg.unit === 'hours') next.setHours(next.getHours() + cfg.n);
          else next.setDate(next.getDate() + cfg.n);
        } else {
          next = new Date();
        }
        if (next <= hrsFromNow(task.upcoming_hrs + 1)) {
          const slotKey = getSlotKey(task, cfg, next, lastDone);
          const existing = taskInstances.filter(i => getSlotKey(task, cfg, new Date(i.due_at), lastDone) === slotKey);
          if (existing.length === 0) {
            const rowId = nextRowId();
            const instId = `${task.task_id}-${Date.now().toString(36)}`;
            db.run(`INSERT INTO instances (row_id,instance_id,task_id,due_at,status,done_at,triggered_by,created_at,change_number,synced,is_duplicate) VALUES (?,?,?,?, 'pending', NULL, NULL, ?,0,0,0)`,
              [rowId, instId, task.task_id, next.toISOString(), new Date().toISOString()]);
            logOp('instances', rowId, 'INSERT', { row_id: rowId, instance_id: instId, task_id: task.task_id, due_at: next.toISOString(), status: 'pending', done_at: null, triggered_by: null, created_at: new Date().toISOString(), change_number: 0, synced: 0, is_duplicate: 0 });
            changed = true;
          }
        }
      }
    }
    else if (task.type === 'calendar') {
      if (pending.length === 0) {
        const next = nextCalendarDue(task, cfg);
        if (next && next <= hrsFromNow(task.upcoming_hrs + 1)) {
          const slotKey = next.toISOString().slice(0, 10);
          const existing = taskInstances.filter(i => new Date(i.due_at).toISOString().slice(0, 10) === slotKey);
          if (existing.length === 0) {
            const rowId = nextRowId();
            const instId = `${task.task_id}-${slotKey}`;
            db.run(`INSERT INTO instances (row_id,instance_id,task_id,due_at,status,done_at,triggered_by,created_at,change_number,synced,is_duplicate) VALUES (?,?,?,?, 'pending', NULL, NULL, ?,0,0,0)`,
              [rowId, instId, task.task_id, next.toISOString(), new Date().toISOString()]);
            logOp('instances', rowId, 'INSERT', { row_id: rowId, instance_id: instId, task_id: task.task_id, due_at: next.toISOString(), status: 'pending', done_at: null, triggered_by: null, created_at: new Date().toISOString(), change_number: 0, synced: 0, is_duplicate: 0 });
            changed = true;
          }
        }
      }
    }
    else if (task.type === 'quantity') {
      const stockQty = getStockQty(task.task_id);
      if (stockQty <= (cfg.threshold || 0) && pending.length === 0) {
        const rowId = nextRowId();
        const instId = `${task.task_id}-low-${Date.now().toString(36)}`;
        db.run(`INSERT INTO instances (row_id,instance_id,task_id,due_at,status,done_at,triggered_by,created_at,change_number,synced,is_duplicate) VALUES (?,?,?,?, 'pending', NULL, NULL, ?,0,0,0)`,
          [rowId, instId, task.task_id, new Date().toISOString(), new Date().toISOString()]);
        logOp('instances', rowId, 'INSERT', { row_id: rowId, instance_id: instId, task_id: task.task_id, due_at: new Date().toISOString(), status: 'pending', done_at: null, triggered_by: null, created_at: new Date().toISOString(), change_number: 0, synced: 0, is_duplicate: 0 });
        changed = true;
      }
    }
    else if (task.type === 'dependency') {
      if (pending.length === 0) {
        const triggerTaskId = cfg.triggerTaskId;
        const triggerInstances = instances.filter(i => i.task_id === triggerTaskId && i.is_duplicate === 0);
        const triggerDone = triggerInstances.filter(i => i.status === 'done' && i.done_at).sort((a, b) => new Date(b.done_at) - new Date(a.done_at))[0];
        if (triggerDone) {
          const delayMs = cfg.delayUnit === 'days' ? (cfg.delay || 0) * 86400000 : (cfg.delay || 0) * 3600000;
          const dueAt = new Date(new Date(triggerDone.done_at).getTime() + delayMs);
          if (dueAt <= hrsFromNow(task.upcoming_hrs + 1)) {
            const existing = taskInstances.filter(i => i.triggered_by === triggerDone.instance_id);
            if (existing.length === 0) {
              const rowId = nextRowId();
              const instId = `${task.task_id}-${Date.now().toString(36)}`;
              db.run(`INSERT INTO instances (row_id,instance_id,task_id,due_at,status,done_at,triggered_by,created_at,change_number,synced,is_duplicate) VALUES (?,?,?,?, 'pending', NULL, ?, ?,0,0,0)`,
                [rowId, instId, task.task_id, dueAt.toISOString(), triggerDone.instance_id, new Date().toISOString()]);
              logOp('instances', rowId, 'INSERT', { row_id: rowId, instance_id: instId, task_id: task.task_id, due_at: dueAt.toISOString(), status: 'pending', done_at: null, triggered_by: triggerDone.instance_id, created_at: new Date().toISOString(), change_number: 0, synced: 0, is_duplicate: 0 });
              changed = true;
            }
          }
        }
      }
    }
  }

  if (changed) await saveDB();
}

// Slot key for sequence: which interval index after lastDone (or 'first' if none)
function getSlotKey(task, cfg, dueDate, lastDone) {
  if (!lastDone) return 'first';
  const intervalMs = cfg.unit === 'hours' ? cfg.n * 3600000 : cfg.n * 86400000;
  const diff = dueDate - new Date(lastDone.done_at);
  return `slot-${Math.floor(diff / intervalMs)}`;
}

function nextCalendarDue(task, cfg) {
  const d = new Date();
  d.setDate(cfg.day);
  d.setHours(23, 59, 59, 999);
  if (cfg.repeat === 'monthly') {
    if (d <= new Date()) d.setMonth(d.getMonth() + 1);
  } else if (cfg.repeat === 'quarterly') {
    const qStart = Math.floor(d.getMonth() / 3) * 3;
    d.setMonth(qStart, cfg.day);
    d.setHours(23, 59, 59, 999);
    if (d <= new Date()) { d.setMonth(Math.floor(d.getMonth() / 3) + 1, 1); d.setMonth(d.getMonth(), cfg.day); d.setHours(23, 59, 59, 999); }
  } else if (cfg.repeat === 'annual') {
    d.setMonth(0, cfg.day);
    d.setHours(23, 59, 59, 999);
    if (d <= new Date()) d.setFullYear(d.getFullYear() + 1);
  }
  return d;
}

let editingNoteId = null;

function renderNotes() {
  const container = document.getElementById('sec-notes-body');
  const notes = getNotes();
  let html = `<div class="note-add-row"><input id="note-new-input" placeholder="Add a note…" /><button onclick="addNote()">Add</button></div>`;
  if (notes.length === 0) {
    html += '<p class="muted">No notes.</p>';
  } else {
    html += notes.map(n => {
      if (n.note_id === editingNoteId) {
        return `<div class="note-item"><input class="note-edit-input" id="note-edit-${n.note_id}" value="${n.text.replace(/"/g, '&quot;')}"/><div class="note-edit-btns"><button class="btn-save-note" onclick="saveNoteEdit('${n.note_id}')">Save</button><button class="btn-cancel-note" onclick="cancelNoteEdit()">Cancel</button></div></div>`;
      }
      return `<div class="note-item${n.done ? ' done' : ''}">
        <input type="checkbox" class="note-check" ${n.done ? 'checked' : ''} onchange="toggleNote(${n.row_id})"/>
        <span class="note-text" ondblclick="startNoteEdit('${n.note_id}')">${n.text}</span>
        <div class="note-actions"><button onclick="startNoteEdit('${n.note_id}')">Edit</button><button class="btn-del" onclick="deleteNote(${n.row_id})">Del</button></div>
      </div>`;
    }).join('');
  }
  container.innerHTML = html;
  const input = document.getElementById('note-new-input');
  if (input) input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addNote(); } });
  if (editingNoteId) {
    const editInput = document.getElementById(`note-edit-${editingNoteId}`);
    if (editInput) {
      editInput.focus();
      editInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveNoteEdit(editingNoteId); } if (e.key === 'Escape') { cancelNoteEdit(); } });
    }
  }
}

};

// ─── Stock ──────────────────────────────────────────────────────────────
let stockInputTaskId = null, stockInputAction = null;

window.showStockInput = function(taskId, action) { stockInputTaskId = taskId; stockInputAction = action; render(); };
window.cancelStockInput = function() { stockInputTaskId = null; stockInputAction = null; render(); };

window.confirmStock = async function() {
  const input = document.getElementById('stock-qty-input');
  const qty = parseInt(input ? input.value : '1');
  if (!qty || qty < 1) return;
  const taskId = stockInputTaskId, action = stockInputAction;
  stockInputTaskId = null; stockInputAction = null;
  const now = new Date().toISOString();
  const rowId = nextRowId();
  db.run(`INSERT INTO stock (row_id,task_id,event,qty,ts,synced,is_duplicate) VALUES (?,?,?,?,?,0,0)`, [rowId, taskId, action, qty, now]);
  logOp('stock', rowId, 'INSERT', { row_id: rowId, task_id: taskId, event: action, qty, ts: now, synced: 0, is_duplicate: 0 });
  const evRow = nextRowId();
  db.run(`INSERT INTO events (row_id,task_id,instance_id,action,ts,note,synced,is_duplicate) VALUES (?,?,?,?,?,?,0,0)`, [evRow, taskId, null, action, now, String(qty)]);
  logOp('events', evRow, 'INSERT', { row_id: evRow, task_id: taskId, instance_id: null, action, ts: now, note: String(qty), synced: 0, is_duplicate: 0 });
  await saveDB();
  await withSpinner('btn-push', pushPending);
  render();
};

// ─── Instance actions ───────────────────────────────────────────────────
window.logAction = async function(instanceId, taskId, action) {
  const ts = new Date().toISOString();
  const evRow = nextRowId();
  db.run(`INSERT INTO events (row_id,task_id,instance_id,action,ts,note,synced,is_duplicate) VALUES (?,?,?,?,?,NULL,0,0)`, [evRow, taskId, instanceId, action, ts]);
  logOp('events', evRow, 'INSERT', { row_id: evRow, task_id: taskId, instance_id: instanceId, action, ts, note: null, synced: 0, is_duplicate: 0 });

  // Update instance status + increment change_number
  if (action === 'done') {
    db.run(`UPDATE instances SET status='done', done_at=?, change_number=change_number+1 WHERE instance_id=?`, [ts, instanceId]);
  } else {
    db.run(`UPDATE instances SET status=?, change_number=change_number+1 WHERE instance_id=?`, [action, instanceId]);
  }
  const updatedRes = db.exec(`SELECT * FROM instances WHERE instance_id=?`, [instanceId]);
  const uCols = updatedRes[0].columns;
  const uRow = Object.fromEntries(uCols.map((c, i) => [c, updatedRes[0].values[0][i]]));
  logOp('instances', uRow.row_id, 'UPDATE', uRow);

  await saveDB();
  await withSpinner('btn-push', pushPending);
  render();
};

// ─── Ignore single instance ─────────────────────────────────────────────
window.ignoreInstance = async function(instanceId) {
  const ts = new Date().toISOString();
  const instRes = db.exec(`SELECT * FROM instances WHERE instance_id=?`, [instanceId]);
  if (instRes.length === 0 || instRes[0].values.length === 0) return;
  const instCols = instRes[0].columns;
  const inst = Object.fromEntries(instCols.map((c, i) => [c, instRes[0].values[0][i]]));

  db.run(`UPDATE instances SET status='ignored', change_number=change_number+1 WHERE instance_id=?`, [instanceId]);
  const updatedRes = db.exec(`SELECT * FROM instances WHERE instance_id=?`, [instanceId]);
  const uCols = updatedRes[0].columns;
  const uRow = Object.fromEntries(uCols.map((c, i) => [c, updatedRes[0].values[0][i]]));
  logOp('instances', uRow.row_id, 'UPDATE', uRow);

  const evRow = nextRowId();
  db.run(`INSERT INTO events (row_id,task_id,instance_id,action,ts,note,synced,is_duplicate) VALUES (?,?,?,?,?,NULL,0,0)`, [evRow, inst.task_id, instanceId, 'ignore', ts]);
  logOp('events', evRow, 'INSERT', { row_id: evRow, task_id: inst.task_id, instance_id: instanceId, action: 'ignore', ts, note: null, synced: 0, is_duplicate: 0 });

  await saveDB();
  await withSpinner('btn-push', pushPending);
  render();
};

// ─── Ignore All Missed ──────────────────────────────────────────────────
window.ignoreAllMissed = async function() {
  const now = new Date().toISOString();
  const res = db.exec(`SELECT instance_id, task_id FROM instances WHERE status IN ('pending','doing','will_do') AND due_at < ? AND is_duplicate=0`, [now]);
  if (res.length === 0 || res[0].values.length === 0) return;
  for (const [instanceId, taskId] of res[0].values) {
    db.run(`UPDATE instances SET status='ignored', change_number=change_number+1 WHERE instance_id=?`, [instanceId]);
    const updatedRes = db.exec(`SELECT * FROM instances WHERE instance_id=?`, [instanceId]);
    const uCols = updatedRes[0].columns;
    const uRow = Object.fromEntries(uCols.map((c, i) => [c, updatedRes[0].values[0][i]]));
    logOp('instances', uRow.row_id, 'UPDATE', uRow);
    const evRow = nextRowId();
    db.run(`INSERT INTO events (row_id,task_id,instance_id,action,ts,note,synced,is_duplicate) VALUES (?,?,?,?,?,NULL,0,0)`, [evRow, taskId, instanceId, 'ignore', now]);
    logOp('events', evRow, 'INSERT', { row_id: evRow, task_id: taskId, instance_id: instanceId, action: 'ignore', ts: now, note: null, synced: 0, is_duplicate: 0 });
  }
  await saveDB();
  await withSpinner('btn-push', pushPending);
  render();
};

// ─── Attendance ─────────────────────────────────────────────────────────
window.logAtt = async function(action) {
  const ts = new Date().toISOString();
  const today = new Date().toISOString().slice(0, 10);
  const rowId = nextRowId();
  if (action === 'checkin' || action === 'recheckin') {
    const res = db.exec(`SELECT COALESCE(MAX(seq),0)+1 FROM attendance WHERE date=?`, [today]);
    const seq = res.length > 0 ? res[0].values[0][0] : 1;
    const localTime = new Date().toTimeString().slice(0, 8);
    db.run(`INSERT INTO attendance (row_id,date,checkin,checkout,seq,synced,is_duplicate) VALUES (?,?,?,?,?,0,0)`, [rowId, today, localTime, null, seq]);
    logOp('attendance', rowId, 'INSERT', { row_id: rowId, date: today, checkin: localTime, checkout: null, seq, synced: 0, is_duplicate: 0 });
  } else {
    const res = db.exec(`SELECT row_id FROM attendance WHERE date=? ORDER BY seq DESC LIMIT 1`, [today]);
    if (res.length > 0 && res[0].values.length > 0) {
      const attRowId = res[0].values[0][0];
      const localTime = new Date().toTimeString().slice(0, 8);
      db.run(`UPDATE attendance SET checkout=? WHERE row_id=?`, [localTime, attRowId]);
      const updatedRes = db.exec(`SELECT * FROM attendance WHERE row_id=?`, [attRowId]);
      const aCols = updatedRes[0].columns;
      const aRow = Object.fromEntries(aCols.map((c, i) => [c, updatedRes[0].values[0][i]]));
      logOp('attendance', attRowId, 'UPDATE', aRow);
    }
  }
  const evRow = nextRowId();
  db.run(`INSERT INTO events (row_id,task_id,instance_id,action,ts,note,synced,is_duplicate) VALUES (?,?,?,?,?,NULL,0,0)`, [evRow, 'attendance', null, action, ts]);
  logOp('events', evRow, 'INSERT', { row_id: evRow, task_id: 'attendance', instance_id: null, action, ts, note: null, synced: 0, is_duplicate: 0 });
  await saveDB();
  await withSpinner('btn-push', pushPending);
  render();
};

// ─── Render ─────────────────────────────────────────────────────────────
async function render() {
  await generateInstances();

  const tasks = getTasks();
  const instances = getInstances();
  const events = getEvents();
  const today = todayStr();

  // Attendance
  const attTasks = tasks.filter(t => t.type === 'attendance');
  const attContainer = document.getElementById('sec-attendance-body');
  if (attTasks.length > 0) {
    const attEvents = events.filter(e => e.task_id === 'attendance' && e.ts.slice(0, 10) === today);
    let html = '';
    if (attEvents.length > 0) {
      let i = 0;
      while (i < attEvents.length) {
        const ev = attEvents[i];
        if (ev.action === 'checkin' || ev.action === 'recheckin') {
          const next = attEvents[i + 1];
          const checkout = next && next.action === 'checkout' ? next : null;
          html += `<div class="card"><div class="att-entry"><strong>#${Math.ceil((i + 1) / 2)}</strong> In: <strong>${fmtTime(ev.ts)}</strong> | Out: <strong>${checkout ? fmtTime(checkout.ts) : '—'}</strong></div></div>`;
          i += checkout ? 2 : 1;
        } else { i++; }
      }
    } else { html += '<p class="muted">No entries yet.</p>'; }
    const lastEv = attEvents[attEvents.length - 1];
    if (!lastEv || lastEv.action === 'checkout') {
      html += `<div class="actions"><button class="btn-checkin" onclick="logAtt('checkin')">Check In</button></div>`;
    } else {
      html += `<div class="actions"><button class="btn-checkout" onclick="logAtt('checkout')">Check Out</button></div>`;
    }
    attContainer.innerHTML = html;
  } else { attContainer.innerHTML = ''; }

  // Categorize
  const missed = [], current = [], upcoming = [], completed = [], ignored = [];
  for (const task of tasks) {
    if (task.type === 'attendance') continue;
    const cfg = JSON.parse(task.config || '{}');
    if (task.type === 'quantity') {
      const stockQty = getStockQty(task.task_id);
      const isLow = stockQty <= (cfg.threshold || 0);
      const pendingInst = instances.find(i => i.task_id === task.task_id && i.status === 'pending' && i.is_duplicate === 0);
      const lastDoneInst = instances.filter(i => i.task_id === task.task_id && i.status === 'done' && i.is_duplicate === 0).sort((a, b) => new Date(b.done_at) - new Date(a.done_at))[0];
      current.push({ task, instance: pendingInst || null, stockQty, isLow, inactive: !isLow && !pendingInst });
      if (lastDoneInst && withinCompletedWindow(lastDoneInst, task)) completed.push({ task, instance: lastDoneInst });
      continue;
    }
    const taskInstances = instances.filter(i => i.task_id === task.task_id && i.is_duplicate === 0);
    const pendingInst = taskInstances.find(i => i.status === 'pending' || i.status === 'doing' || i.status === 'will_do');
    const lastDoneInst = taskInstances.filter(i => i.status === 'done').sort((a, b) => new Date(b.done_at) - new Date(a.done_at))[0];
    const ignoredInsts = taskInstances.filter(i => i.status === 'ignored');

    if (pendingInst) {
      const due = new Date(pendingInst.due_at);
      const hrsUntil = (due - now()) / 3600000;
      if (hrsUntil < 0) missed.push({ task, instance: pendingInst });
      else if (hrsUntil <= task.current_hrs) current.push({ task, instance: pendingInst });
      else if (hrsUntil <= task.upcoming_hrs) upcoming.push({ task, instance: pendingInst });
    }
    if (lastDoneInst && withinCompletedWindow(lastDoneInst, task)) completed.push({ task, instance: lastDoneInst });
    for (const ig of ignoredInsts) ignored.push({ task, instance: ig });
  }

  // Missed with "Ignore All"
  let missedHtml = renderSection('⚠️ Missed', missed, renderCard);
  if (missed.length > 0) {
    missedHtml = `<div style="margin-bottom:0.5rem;text-align:right"><button onclick="ignoreAllMissed()" style="padding:0.2rem 0.6rem;font-size:0.7rem;background:#6b7280;color:#fff;border:none;border-radius:3px;cursor:pointer">Ignore All</button></div>` + missedHtml;
  }
  document.getElementById('sec-missed-body').innerHTML = missedHtml;
  document.getElementById('sec-current-body').innerHTML = renderSection('📋 Current', current, renderCard);
  document.getElementById('sec-upcoming-body').innerHTML = renderSection('📅 Upcoming', upcoming, renderCard);
  document.getElementById('sec-completed-body').innerHTML = renderSection('✅ Completed', completed, renderDoneCard);
  document.getElementById('sec-ignored-body').innerHTML = renderSection('🚫 Ignored', ignored, renderIgnoredCard);
  renderNotes();

  // Event log
  const logContainer = document.getElementById('events-log');
  if (events.length > 0) {
    logContainer.innerHTML = '<h3 style="margin-top:1.5rem;font-size:0.95rem">📜 Event Log (last 20)</h3>' +
      events.slice(-20).reverse().map(e =>
        `<div class="event-row"><span class="ts">${new Date(e.ts).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</span> <strong>${e.action}</strong> ${e.task_id}${e.note ? ' — ' + e.note : ''}</div>`
      ).join('');
  } else { logContainer.innerHTML = ''; }
}

function withinCompletedWindow(inst, task) {
  const done = new Date(inst.done_at);
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - task.completed_days);
  return done >= cutoff;
}

function renderSection(title, items, renderFn) {
  if (items.length === 0) return `<p class="muted">Nothing here.</p>`;
  return items.map(renderFn).join('');
}

function renderCard({ task, instance, stockQty, isLow, inactive }) {
  const cfg = JSON.parse(task.config || '{}');
  let html = `<div class="card${inactive ? ' inactive' : ''}">`;
  html += `<div class="card-header"><strong>${task.name}</strong>`;
  if (task.type === 'dependency') html += `<span class="badge badge-dep">⚡ dependency</span>`;
  else if (task.type === 'standalone') html += `<span class="badge badge-standalone">one-time</span>`;
  else html += `<span class="badge ${instance ? 'badge-pending' : (isLow ? 'badge-low' : 'badge-ok')}">${instance ? instance.status : (isLow ? 'LOW' : 'ok')}</span>`;
  html += `</div>`;

  if (task.type === 'dependency' && instance && instance.triggered_by) {
    const triggerTask = getTasks().find(t => t.task_id === cfg.triggerTaskId);
    html += `<div class="card-meta">⚡ Triggered by: ${triggerTask ? triggerTask.name : cfg.triggerTaskId}</div>`;
  }

  if (instance) {
    const due = new Date(instance.due_at);
    const hrsUntil = Math.round((due - now()) / 3600000);
    html += `<div class="card-meta">Due: ${fmtDate(due)} ${fmtTime(due)} (${hrsUntil > 0 ? hrsUntil + 'h from now' : Math.abs(hrsUntil) + 'h ago'})</div>`;
  }

  if (task.type === 'quantity') {
    const threshold = cfg.threshold || 0;
    const max = Math.max(stockQty, threshold * 3, 10);
    const pct = Math.min((stockQty / max) * 100, 100);
    html += `<div class="stock-label">Stock: <strong>${stockQty}</strong> / threshold ${threshold}</div>`;
    html += `<div class="stock-bar-bg"><div class="stock-bar-fill${isLow ? ' low' : ''}" style="width:${pct}%"></div></div>`;
    if (stockInputTaskId === task.task_id) {
      html += `<div class="stock-input-row"><input id="stock-qty-input" type="number" min="1" value="1" placeholder="Qty"/><button onclick="confirmStock()">${stockInputAction === 'consume' ? 'Consume' : 'Restock'}</button><button style="background:#e5e7eb;color:#374151" onclick="cancelStockInput()">✕</button></div>`;
    } else {
      html += `<div class="actions"><button onclick="showStockInput('${task.task_id}','consume')">Consume</button><button onclick="showStockInput('${task.task_id}','restock')">Restock</button></div>`;
    }
  }

  if (instance && instance.status !== 'done' && task.type !== 'quantity') {
    html += `<div class="actions">
      <button onclick="logAction('${instance.instance_id}','${task.task_id}','will_do')">Will do</button>
      <button onclick="logAction('${instance.instance_id}','${task.task_id}','doing')">Doing</button>
      <button class="btn-done" onclick="logAction('${instance.instance_id}','${task.task_id}','done')">Done</button>
      <button style="background:#f3f4f6;color:#6b7280" onclick="ignoreInstance('${instance.instance_id}')">Ignore</button>
    </div>`;
  }
  html += `</div>`;
  return html;
}

function renderDoneCard({ task, instance }) {
  const cfg = JSON.parse(task.config || '{}');
  let extra = '';
  if (task.type === 'dependency' && instance.triggered_by) {
    const triggerTask = getTasks().find(t => t.task_id === cfg.triggerTaskId);
    extra = `<div class="card-meta">⚡ Triggered by: ${triggerTask ? triggerTask.name : cfg.triggerTaskId}</div>`;
  }
  return `<div class="card done">
    <div class="card-header"><strong>${task.name}</strong><span class="badge badge-done">done</span></div>
    ${extra}
    <div class="card-meta">Done: ${fmtDate(instance.done_at)} ${fmtTime(instance.done_at)}</div>
  </div>`;
}

function renderIgnoredCard({ task, instance }) {
  return `<div class="card" style="opacity:0.5">
    <div class="card-header"><strong>${task.name}</strong><span class="badge" style="background:#f3f4f6;color:#6b7280">ignored</span></div>
    <div class="card-meta">Was due: ${fmtDate(instance.due_at)} ${fmtTime(instance.due_at)}</div>
  </div>`;
}

// ─── Login ──────────────────────────────────────────────────────────────
document.getElementById('loginBtn').addEventListener('click', async () => {
  const name = document.getElementById('loginName').value.trim();
  const token = document.getElementById('loginToken').value.trim();
  const err = document.getElementById('login-error');
  if (!name || !token) { err.textContent = 'Both fields required.'; err.style.display = 'block'; return; }
  if (token.length < ENC_KEY_LEN + 36) { err.textContent = 'Token too short. Expected PAT + 64-char key.'; err.style.display = 'block'; return; }
  encKey = token.slice(-ENC_KEY_LEN);
  const pat = token.slice(0, -ENC_KEY_LEN);
  try {
    const res = await fetch('https://api.github.com/user', { headers: { 'Authorization': `Bearer ${pat}`, 'User-Agent': 'office-pwa' } });
    if (!res.ok) throw new Error();
  } catch { err.textContent = 'Invalid PAT.'; err.style.display = 'block'; return; }
  localStorage.setItem('fe_token', pat);
  localStorage.setItem('fe_user', name);
  localStorage.setItem('fe_enc_key', encKey);
  if (!localStorage.getItem('fe_device_id')) {
    const d = prompt('Device number (1=PC, 2=mobile):', '1');
    localStorage.setItem('fe_device_id', String(parseInt(d) || 1));
  }
  deviceId = parseInt(localStorage.getItem('fe_device_id')) || 1;
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('userLabel').textContent = name;
  await startApp();
});

// ─── App boot ───────────────────────────────────────────────────────────
async function startApp() {
  await initDB();
  encKey = localStorage.getItem('fe_enc_key');
  deviceId = parseInt(localStorage.getItem('fe_device_id')) || 1;
  await ensureRepoReady();   // ← this one line
  await doPull();
  await pushPending();
  updateSyncBadge();
  render();
  restoreSecPrefs();
  //setInterval(async () => { await doPull(); render(); updateSyncBadge(); }, 60000);
  let lastBgPull = 0;
setInterval(async () => {
  if (document.hidden) {
    const now = Date.now();
    if (now - lastBgPull < 1800000) return; // 30 min
    lastBgPull = now;
  }
  await doPull(); render(); updateSyncBadge();
}, 60000);   

// Immediate pull on regaining focus
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden) { await doPull(); render(); updateSyncBadge(); }
});
}

// ─── Auto-boot ──────────────────────────────────────────────────────────
(async () => {
  const pat = localStorage.getItem('fe_token');
  const user = localStorage.getItem('fe_user');
  encKey = localStorage.getItem('fe_enc_key');
  if (pat && user && encKey) {
    deviceId = parseInt(localStorage.getItem('fe_device_id')) || 1;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = '';
    document.getElementById('userLabel').textContent = user;
    await startApp();
  }
})();
</script>
