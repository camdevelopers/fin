<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>My Workspace</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1.5rem;
    }

    .header {
      text-align: center;
      color: #fff;
      margin-bottom: 2.5rem;
    }

    .header h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header p {
      margin-top: 0.4rem;
      font-size: clamp(0.9rem, 3vw, 1.05rem);
      opacity: 0.85;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      width: 100%;
      max-width: 420px;
    }

    @media (min-width: 480px) {
      .cards { grid-template-columns: 1fr 1fr; }
      .cards a:last-child { grid-column: 1 / -1; }
    }

    @media (min-width: 768px) {
      .cards { grid-template-columns: repeat(3, 1fr); max-width: 640px; }
      .cards a:last-child { grid-column: auto; }
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 2rem 1.25rem;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 1.25rem;
      text-decoration: none;
      color: #fff;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .card:hover, .card:focus {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      background: rgba(255, 255, 255, 0.25);
    }

    .card:active {
      transform: translateY(-2px) scale(0.98);
    }

    .card-icon {
      width: 3.5rem;
      height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 1rem;
      font-size: 1.6rem;
    }

    .card-label {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .card-desc {
      font-size: 0.8rem;
      opacity: 0.8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>My Workspace</h1>
    <p>Quick access to your tools</p>
  </div>

  <nav class="cards">
    <a href="expenses.html" class="card">
      <div class="card-icon">💰</div>
      <span class="card-label">Expenses</span>
      <span class="card-desc">Track your spending</span>
    </a>
    <a href="office/work.html" class="card">
      <div class="card-icon">💼</div>
      <span class="card-label">Work</span>
      <span class="card-desc">Office & tasks</span>
    </a>
    <a href="fee.html" class="card">
      <div class="card-icon">🧾</div>
      <span class="card-label">Fees</span>
      <span class="card-desc">Manage fees</span>
    </a>
  </nav>

</body>
</html>
