<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">
  <meta name="description" content="My Workspace — quick access to your tools">
  <title>My Workspace</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #6b21a8 100%);
      background-size: 300% 300%;
      animation: gradientShift 12s ease infinite;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header {
      text-align: center;
      color: #fff;
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }

    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header p {
      margin-top: 0.5rem;
      font-size: 1rem;
      opacity: 0.75;
      font-weight: 400;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    @media (min-width: 768px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
        max-width: 1200px;
      }
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 1.75rem 1.25rem 1.5rem;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 1.25rem;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      opacity: 0;
      transform: translateY(24px);
      animation: cardEnter 0.6s ease forwards;
    }

    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.25s; }
    .card:nth-child(3) { animation-delay: 0.4s; }

    @keyframes cardEnter {
      to { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.1);
    }

    /* Mouse-tracking glow */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        600px circle at var(--mx, 50%) var(--my, 50%),
        rgba(255,255,255,0.12),
        transparent 40%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .card:hover::before {
      opacity: 1;
    }

    /* Stretched main link */
    .card-main-link {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      text-decoration: none;
    }

    .card-main-link:focus-visible {
      outline: 2px solid rgba(255,255,255,0.8);
      outline-offset: 3px;
    }

    .card-header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      pointer-events: none;
    }

    .card-icon {
      width: 2.75rem;
      height: 2.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.18);
      border-radius: 0.75rem;
      font-size: 1.35rem;
      animation: float 3s ease-in-out infinite;
    }

    .card:nth-child(2) .card-icon { animation-delay: 0.5s; }
    .card:nth-child(3) .card-icon { animation-delay: 1s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .card-desc {
      position: relative;
      z-index: 1;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.6);
      text-align: center;
      pointer-events: none;
    }

    .pills {
      position: relative;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      margin-top: 0.25rem;
    }

    @media (min-width: 768px) {
      .pills {
        flex-wrap: nowrap;
        justify-content: space-evenly;
      }
    }

    .pill {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      padding: 0 0.6rem;
      height: 32px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      transition: background 0.2s, transform 0.2s, border-color 0.2s;
    }

    .pill:hover, .pill:focus {
      background: rgba(255,255,255,0.32);
      border-color: rgba(255,255,255,0.4);
      transform: scale(1.06);
    }

    .pill:focus-visible {
      outline: 2px solid rgba(255,255,255,0.8);
      outline-offset: 2px;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .card {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>My Workspace</h1>
    <p id="greeting">Quick access to your tools</p>
  </div>

  <nav class="cards" aria-label="Workspace navigation">

    <div class="card">
      <a href="expenses.html" class="card-main-link" aria-label="Expenses"></a>
      <div class="card-header">
        <div class="card-icon">💰</div>
        <span class="card-title">Expenses</span>
      </div>
      <p class="card-desc">Track daily spending</p>
      <div class="pills">
        <a href="view.html" class="pill">Transactions</a>
        <a href="kitchen.html" class="pill">Kitchen</a>
      </div>
    </div>

    <div class="card">
      <a href="office/work.html" class="card-main-link" aria-label="Work"></a>
      <div class="card-header">
        <div class="card-icon">💼</div>
        <span class="card-title">Work</span>
      </div>
      <p class="card-desc">Tasks, dashboard &amp; settings</p>
      <div class="pills">
        <a href="office/tasks.html" class="pill">Tasks</a>
        <a href="office/dashboard.html" class="pill">Dashboard</a>
        <a href="office/settings.html" class="pill">Settings</a>
      </div>
    </div>

    <div class="card">
      <a href="fee.html" class="card-main-link" aria-label="Fees"></a>
      <div class="card-header">
        <div class="card-icon">🧾</div>
        <span class="card-title">Fees</span>
      </div>
      <p class="card-desc">Manage collections &amp; history</p>
      <div class="pills">
        <a href="fee/collect.html" class="pill">Collect</a>
        <a href="fee/history.html" class="pill">History</a>
        <a href="fee/reminders.html" class="pill">Reminders</a>
      </div>
    </div>

  </nav>

  <script>
    // Time-based greeting
    (function () {
      const h = new Date().getHours();
      const el = document.getElementById('greeting');
      const greeting = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      el.textContent = greeting + ' — quick access to your tools';
    })();

    // Mouse-tracking radial glow
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
    });
  </script>

</body>
</html>
