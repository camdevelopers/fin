<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Log</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 0 auto; padding: 1rem; }
    h2 { margin-bottom: 0.5rem; }
    h3 { margin: 1.2rem 0 0.5rem; font-size: 0.95rem; }
    .card { border:1px solid #e5e7eb; border-radius:8px; padding:0.75rem; margin:0.5rem 0; }
    .card.inactive { opacity:0.55; }
    .card.done { border-left:3px solid #059669; opacity:0.7; }
    .card.leave { border-left:3px solid #f59e0b; }
    .card.ignored { border-left:3px solid #6b7280; opacity:0.6; }
    .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.3rem; }
    .card-header strong { font-size:0.95rem; }
    .card-meta { font-size:0.8rem; color:#6b7280; }
    .badge { font-size:0.7rem; padding:0.15rem 0.4rem; border-radius:3px; }
    .badge-pending { background:#fef3c7; color:#92400e; }
    .badge-done { background:#d1fae5; color:#065f46; }
    .badge-low { background:#fee2e2; color:#991b1b; }
    .badge-ok { background:#d1fae5; color:#065f46; }
    .badge-standalone { background:#e5e7eb; color:#374151; }
    .badge-dep { background:#ede9fe; color:#5b21b6; }
    .badge-leave { background:#fef3c7; color:#92400e; }
    .badge-ignore { background:#e5e7eb; color:#6b7280; }
    .actions { display:flex; gap:0.4rem; margin-top:0.5rem; flex-wrap:wrap; align-items:center; }
    .actions button { padding:0.3rem 0.7rem; border:1px solid #d1d5db; border-radius:4px; cursor:pointer; font-size:0.8rem; background:#fff; }
    .actions button:hover { background:#f3f4f6; }
    .btn-done { background:#059669 !important; color:#fff !important; border-color:#059669 !important; }
    .btn-checkin { background:#2563eb !important; color:#fff !important; border-color:#2563eb !important; }
    .btn-checkout { background:#dc2626 !important; color:#fff !important; border-color:#dc2626 !important; }
    .btn-leave { background:#f59e0b !important; color:#fff !important; border-color:#f59e0b !important; }
    .btn-ignore { background:#6b7280 !important; color:#fff !important; border-color:#6b7280 !important; }
    .stock-bar-bg { height:6px; background:#e5e7eb; border-radius:3px; margin-top:0.4rem; overflow:hidden; }
    .stock-bar-fill { height:100%; background:#059669; border-radius:3px; }
    .stock-bar-fill.low { background:#dc2626; }
    .stock-label { font-size:0.8rem; color:#6b7280; margin-top:0.3rem; }
    .att-entry { font-size:0.85rem; padding:0.25rem 0; border-bottom:1px solid #f3f4f6; }
    .att-summary { font-size:0.9rem; font-weight:600; margin-top:0.5rem; padding:0.4rem; background:#f0fdf4; border-radius:4px; }
    .leave-toggle { display:inline-flex; align-items:center; gap:0.5rem; margin-top:0.5rem; padding:0.4rem 0.8rem; border-radius:6px; cursor:pointer; font-size:0.85rem; font-weight:600; border:2px solid #f59e0b; background:#fffbeb; color:#92400e; }
    .leave-toggle.active { background:#f59e0b; color:#fff; }
    .events-log { margin-top:1.5rem; }
    .event-row { font-size:0.8rem; padding:0.25rem 0; border-bottom:1px solid #f3f4f6; color:#374151; }
    .event-row .ts { color:#6b7280; }
    a { display:inline-block; margin-top:1rem; color:#2563eb; text-decoration:none; }
    .muted { color:#6b7280; }
    .btn-row { display:flex; gap:0.5rem; margin-top:1rem; flex-wrap:wrap; align-items:center; }
    .btn-row button { padding:0.4rem 0.8rem; border:none; border-radius:4px; cursor:pointer; color:#fff; }
    .btn-pull { background:#0891b2; }
    .quick-add { display:flex; gap:0.5rem; margin-bottom:1rem; padding:0.6rem; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; }
    .quick-add input { flex:1; padding:0.4rem 0.6rem; border:1px solid #d1d5db; border-radius:4px; font-size:0.9rem; }
    .quick-add button { padding:0.4rem 0.9rem; background:#059669; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:600; font-size:0.85rem; }
    .status-msg { font-size:0.8rem; color:#059669; margin-top:0.3rem; }
    .note-item { display:flex; align-items:flex-start; gap:0.5rem; padding:0.5rem 0.6rem; border:1px solid #e5e7eb; border-radius:6px; margin-bottom:0.4rem; }
    .note-item.done { opacity:0.6; }
    .note-item.done .note-text { text-decoration:line-through; }
    .note-check { width:20px; height:20px; margin-top:2px; cursor:pointer; accent-color:#059669; }
    .note-text { flex:1; font-size:0.9rem; }
    .note-actions { display:flex; gap:0.3rem; }
    .note-actions button { padding:0.15rem 0.4rem; font-size:0.7rem; border:1px solid #d1d5db; border-radius:3px; cursor:pointer; background:#fff; }
    .note-actions .btn-del { background:#fee2e2; color:#991b1b; border-color:#fca5a5; }
    .note-add-row { display:flex; gap:0.5rem; margin-bottom:0.75rem; }
    .note-add-row input { flex:1; padding:0.4rem 0.6rem; border:1px solid #d1d5db; border-radius:4px; font-size:0.9rem; }
    .note-add-row button { padding:0.4rem 0.9rem; background:#2563eb; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:600; font-size:0.85rem; }
    .note-edit-input { flex:1; padding:0.3rem 0.5rem; border:1px solid #2563eb; border-radius:4px; font-size:0.9rem; }
    .note-edit-btns { display:flex; gap:0.3rem; }
    .note-edit-btns button { padding:0.2rem 0.5rem; font-size:0.75rem; border:none; border-radius:3px; cursor:pointer; }
    .note-edit-btns .btn-save-note { background:#059669; color:#fff; }
    .note-edit-btns .btn-cancel-note { background:#e5e7eb; color:#374151; }
    .stock-input-row { display:flex; gap:0.3rem; align-items:center; margin-top:0.4rem; }
    .stock-input-row input { width:60px; padding:0.25rem 0.4rem; border:1px solid #d1d5db; border-radius:4px; font-size:0.8rem; }
    .stock-input-row button { padding:0.25rem 0.6rem; font-size:0.75rem; border:none; border-radius:4px; cursor:pointer; background:#2563eb; color:#fff; }
    .section { border:2px solid #111; border-radius:10px; padding:0.75rem 1rem; margin:0.75rem 0; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
    .section h3 { margin-top:0; }
    #sec-ignored { border-left:4px solid #6b7280; }
    #sec-leave { border-left:4px solid #f59e0b; }
    details#sec-ignored summary { cursor:pointer; font-weight:600; font-size:0.95rem; }
    .sync-status { font-size:0.75rem; color:#6b7280; margin-top:0.3rem; }
  </style>
</head>
<body>
  <h2>Work Log <span class="muted" style="font-size:0.75rem">[Device ${''}]</span></h2>

  <div class="quick-add">
    <input id="quick-add-input" placeholder="Quick add: type a job and press Add…" />
    <button onclick="quickAdd()">Add</button>
  </div>

  <div class="section" id="sec-attendance"></div>
  <div class="section" id="sec-missed"></div>
  <div class="section" id="sec-leave"></div>
  <div class="section" id="sec-current"></div>
  <div class="section" id="sec-upcoming"></div>
  <div class="section" id="sec-completed"></div>
  <div class="section" id="sec-notes"></div>
  <details class="section" id="sec-ignored"><summary>🚫 Ignored</summary><div id="sec-ignored-content"></div></details>

  <div class="btn-row">
    <a href="tasks.html">→ Manage Tasks</a>
    <button class="btn-pull" onclick="doPull()">⬇ Pull</button>
    <span id="pull-status" class="status-msg"></span>
  </div>
  <div class="sync-status" id="sync-status"></div>

  <div class="events-log" id="events-log"></div>

  <script>
    // *** HARDCODE THIS: 1 or 2 ***
    //window.DEVICE_ID = 1;
  </script>
  <script src="store.js"></script>
  <script>
    let tasksCache = [];
    let editingNoteId = null;
    let confirmingDeleteId = null;
    let stockInputTaskId = null;
    let stockInputAction = null;

    // --- Quick Add ---
    window.quickAdd = function() {
      const input = document.getElementById('quick-add-input');
      const name = input.value.trim();
      if (!name) return;
      const id = `job-${Date.now().toString(36)}`;
      Store.writeTask({ id, name, type:'standalone', desc:'unplanned', config:{deadline:null}, upcomingHrs:0, currentHrs:9999, completedDays:3, createdAt:now().toISOString() });
      const instId = genInstanceId({ id, type:'standalone' });
      Store.writeInstance({ id:instId, taskId:id, dueAt:now().toISOString(), status:'pending', createdAt:now().toISOString(), updatedAt:now().toISOString() });
      input.value = '';
      render();
    };
    document.getElementById('quick-add-input').addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); quickAdd(); } });

    // --- Instance Generation ---
    function generateInstances() {
      const tasks = Store.readTasks();
      const instances = Store.readInstances();
      const leaveActive = Store.readMeta('leave_active') === true;
      let newOnes = [];

      for (const task of tasks) {
        if (task.type === 'attendance') continue;
        const taskInstances = instances.filter(i => i.taskId === task.id);
        const pending = taskInstances.filter(i => ['pending','doing','will_do','leave'].includes(i.status));
        const lastDone = taskInstances.filter(i => i.status==='done' || i.status==='ignore').sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt))[0];

        if (task.type === 'sequence') {
          if (pending.length === 0) {
            let next;
            if (lastDone) {
              next = new Date(lastDone.updatedAt);
              if (task.config.unit==='hours') next.setHours(next.getHours()+task.config.n);
              else next.setDate(next.getDate()+task.config.n);
            } else { next = new Date(); }
            if (next <= hrsFromNow(task.upcomingHrs + 1)) {
              const seqNum = nextSeqNumber(instances, task.id);
              const instId = genInstanceId(task, { seqNumber: seqNum });
              if (!instances.find(i => i.id === instId) && !newOnes.find(i => i.id === instId)) {
                newOnes.push({ id:instId, taskId:task.id, dueAt:next.toISOString(), status:leaveActive?'leave':'pending', seqNumber:seqNum, linkNumber: getLatestDoneSeq(instances, task.id), createdAt:now().toISOString(), updatedAt:now().toISOString() });
              }
            }
          }
        }
        else if (task.type === 'calendar') {
          if (pending.length === 0) {
            const next = nextCalendarDue(task);
            if (next && next <= hrsFromNow(task.upcomingHrs + 1)) {
              const instId = genInstanceId(task, { dueAt: next });
              if (!instances.find(i => i.id === instId) && !newOnes.find(i => i.id === instId)) {
                newOnes.push({ id:instId, taskId:task.id, dueAt:next.toISOString(), status:leaveActive?'leave':'pending', createdAt:now().toISOString(), updatedAt:now().toISOString() });
              }
            }
          }
        }
        else if (task.type === 'quantity') {
          const stock = Store.readStock(task.id);
          if (stock.qty <= task.config.threshold && pending.length === 0) {
            const seqNum = nextSeqNumber(instances, task.id);
            const instId = genInstanceId(task, { seqNumber: seqNum });
            if (!instances.find(i => i.id === instId) && !newOnes.find(i => i.id === instId)) {
              newOnes.push({ id:instId, taskId:task.id, dueAt:now().toISOString(), status:leaveActive?'leave':'pending', seqNumber:seqNum, linkNumber: getLatestDoneSeq(instances, task.id), createdAt:now().toISOString(), updatedAt:now().toISOString() });
            }
          }
        }
        else if (task.type === 'dependency') {
          if (pending.length === 0) {
            const triggerInstances = instances.filter(i => i.taskId === task.config.triggerTaskId);
            const triggerDone = triggerInstances.filter(i => i.status==='done').sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt))[0];
            if (triggerDone) {
              const delayMs = task.config.delayUnit==='days' ? (task.config.delay||0)*86400000 : (task.config.delay||0)*3600000;
              const dueAt = new Date(new Date(triggerDone.updatedAt).getTime() + delayMs);
              if (dueAt <= hrsFromNow(task.upcomingHrs + 1)) {
                const instId = genInstanceId(task, { triggerInstanceId: triggerDone.id, dueAt });
                if (!instances.find(i => i.id === instId) && !newOnes.find(i => i.id === instId)) {
                  newOnes.push({ id:instId, taskId:task.id, dueAt:dueAt.toISOString(), status:leaveActive?'leave':'pending', createdAt:now().toISOString(), updatedAt:now().toISOString(), triggeredBy:triggerDone.id });
                }
              }
            }
          }
        }
      }

      for (const inst of newOnes) Store.writeInstance(inst);
    }

    function nextCalendarDue(task) {
      const d = new Date();
      d.setDate(task.config.day);
      d.setHours(23,59,59,999);
      if (task.config.repeat==='monthly') { if (d <= now()) d.setMonth(d.getMonth()+1); }
      else if (task.config.repeat==='quarterly') {
        const qStart = Math.floor(d.getMonth()/3)*3;
        d.setMonth(qStart, task.config.day); d.setHours(23,59,59,999);
        if (d <= now()) { d.setMonth(Math.floor(d.getMonth()/3)+1, 1); d.setMonth(d.getMonth(), task.config.day); d.setHours(23,59,59,999); }
      }
      else if (task.config.repeat==='annual') { d.setMonth(0, task.config.day); d.setHours(23,59,59,999); if (d <= now()) d.setFullYear(d.getFullYear()+1); }
      return d;
    }

    // --- Leave Toggle ---
    window.toggleLeave = function() {
      const active = Store.readMeta('leave_active') === true;
      Store.writeMeta('leave_active', !active);
      if (!active) {
        const tasks = Store.readTasks();
        const instances = Store.readInstances();
        for (const inst of instances) {
          if (['pending','doing','will_do'].includes(inst.status)) {
            const task = tasks.find(t => t.id === inst.taskId);
            if (task) {
              const hrsUntil = (new Date(inst.dueAt) - now()) / 3600000;
              if (hrsUntil <= task.currentHrs) {
                inst.status = 'leave'; inst.updatedAt = now().toISOString();
                Store.writeInstance(inst);
              }
            }
          }
        }
      }
      render();
    };

    // --- Notes ---
    function renderNotes() {
      const container = document.getElementById('sec-notes');
      const notes = Store.readNotes();
      let html = '<h3>📝 Notes</h3><div class="note-add-row"><input id="note-new-input" placeholder="Add a note…" /><button onclick="addNote()">Add</button></div>';
      if (!notes.length) html += '<p class="muted">No notes.</p>';
      else html += notes.map(n => {
        if (n.id === editingNoteId) return `<div class="note-item"><input class="note-edit-input" id="note-edit-${n.id}" value="${n.text.replace(/"/g,'&quot;')}" /><div class="note-edit-btns"><button class="btn-save-note" onclick="saveNoteEdit('${n.id}')">Save</button><button class="btn-cancel-note" onclick="cancelNoteEdit()">Cancel</button></div></div>`;
        return `<div class="note-item${n.done?' done':''}"><input type="checkbox" class="note-check" ${n.done?'checked':''} onchange="toggleNote('${n.id}')"><span class="note-text" ondblclick="startNoteEdit('${n.id}')">${n.text}</span><div class="note-actions"><button onclick="startNoteEdit('${n.id}')">Edit</button><button class="btn-del" onclick="deleteNote('${n.id}')">Del</button></div></div>`;
      }).join('');
      container.innerHTML = html;
      const input = document.getElementById('note-new-input');
      if (input) input.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); addNote(); } });
      if (editingNoteId) {
        const ei = document.getElementById(`note-edit-${editingNoteId}`);
        if (ei) { ei.focus(); ei.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); saveNoteEdit(editingNoteId); } if (e.key==='Escape') cancelNoteEdit(); }); }
      }
    }
    window.addNote = function() { const i=document.getElementById('note-new-input'); const t=i.value.trim(); if(!t)return; Store.writeNote({id:`n-${Date.now().toString(36)}`,text:t,done:false,createdAt:now().toISOString()}); i.value=''; renderNotes(); };
    window.toggleNote = function(id) { const n=Store.readNotes().find(x=>x.id===id); if(n){n.done=!n.done; Store.writeNote(n);} renderNotes(); };
    window.startNoteEdit = function(id) { editingNoteId=id; renderNotes(); };
    window.cancelNoteEdit = function() { editingNoteId=null; renderNotes(); };
    window.saveNoteEdit = function(id) { const i=document.getElementById(`note-edit-${id}`); const t=i?i.value.trim():''; if(!t)return; const n=Store.readNotes().find(x=>x.id===id); if(n){n.text=t;n.editedAt=now().toISOString();Store.writeNote(n);} editingNoteId=null; renderNotes(); };
    window.deleteNote = function(id) { if(confirmingDeleteId===id){Store.deleteNote(id);confirmingDeleteId=null;renderNotes();} else {confirmingDeleteId=id;renderNotes();} };

    // --- Main Render ---
    function render() {
      generateInstances();
      const tasks = Store.readTasks();
      const instances = Store.readInstances();
      const events = Store.readEvents();
      const today = todayStr();
      const leaveActive = Store.readMeta('leave_active') === true;
      tasksCache = tasks;

      // Attendance
      const attTasks = tasks.filter(t => t.type==='attendance');
      const attC = document.getElementById('sec-attendance');
      if (attTasks.length) {
        const attEvents = events.filter(e => e.taskId==='attendance' && e.ts.slice(0,10)===today);
        let html = '<h3>🕐 Attendance (Today)</h3>';
        let totalMs = 0;
        for (let i=0;i<attEvents.length;i++) { if(attEvents[i].action==='checkin'){const nx=attEvents[i+1]; if(nx&&nx.action==='checkout') totalMs+=new Date(nx.ts)-new Date(attEvents[i].ts);} }
        html += `<div class="att-summary">Total present: <strong>${totalMs>0?fmtDuration(totalMs):'0m'}</strong></div>`;
        if (attEvents.length) {
          let i=0;
          while(i<attEvents.length){const ev=attEvents[i];if(ev.action==='checkin'){const nx=attEvents[i+1];const co=nx&&nx.action==='checkout'?nx:null;html+=`<div class="card"><div class="att-entry"><strong>#${Math.ceil((i+1)/2)}</strong> In: <strong>${fmtTime(ev.ts)}</strong> | Out: <strong>${co?fmtTime(co.ts):'—'}</strong></div></div>`;i+=co?2:1;}else i++;}
        } else html += '<p class="muted">No entries yet.</p>';
        const lastEv = attEvents[attEvents.length-1];
        if (!lastEv || lastEv.action==='checkout') html += `<div class="actions"><button class="btn-checkin" onclick="logAtt('checkin')">Check In</button></div>`;
        else html += `<div class="actions"><button class="btn-checkout" onclick="logAtt('checkout')">Check Out</button></div>`;
        html += `<div class="leave-toggle${leaveActive?' active':''}" onclick="toggleLeave()">${leaveActive?'🏖 On Leave — tap to end':'🏖 On Leave'}</div>`;
        attC.innerHTML = html;
      } else attC.innerHTML = '';

      // Categorize
      const missed=[],leave=[],current=[],upcoming=[],completed=[],ignored=[];
      for (const task of tasks) {
        if (task.type==='attendance') continue;
        if (task.type==='quantity') {
          const stock = Store.readStock(task.id);
          const isLow = stock.qty <= task.config.threshold;
          const pInst = instances.find(i => i.taskId===task.id && (i.status==='pending'||i.status==='leave'));
          const lastDone = instances.filter(i => i.taskId===task.id && i.status==='done').sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt))[0];
          current.push({task, instance:pInst||null, stock, isLow, inactive:!isLow&&!pInst});
          if (lastDone && withinWindow(lastDone, task)) completed.push({task, instance:lastDone});
          continue;
        }
        const tInsts = instances.filter(i => i.taskId===task.id);
        tInsts.filter(i=>i.status==='ignore').forEach(inst=>ignored.push({task,instance:inst}));
        const pInst = tInsts.find(i=>['pending','doing','will_do'].includes(i.status));
        const lInst = tInsts.find(i=>i.status==='leave');
        const lastDone = tInsts.filter(i=>i.status==='done').sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt))[0];
        if (lInst) leave.push({task, instance:lInst});
        if (pInst) {
          const hrs = (new Date(pInst.dueAt)-now())/3600000;
          if (hrs<0) missed.push({task,instance:pInst});
          else if (hrs<=task.currentHrs) current.push({task,instance:pInst});
          else if (hrs<=task.upcomingHrs) upcoming.push({task,instance:pInst});
        }
        if (lastDone && withinWindow(lastDone, task)) completed.push({task, instance:lastDone});
      }

      document.getElementById('sec-missed').innerHTML = section('⚠️ Missed', missed, renderCard);
      document.getElementById('sec-leave').innerHTML = section('🏖 Leave', leave, renderCard);
      document.getElementById('sec-current').innerHTML = section('📋 Current', current, renderCard);
      document.getElementById('sec-upcoming').innerHTML = section('📅 Upcoming', upcoming, renderCard);
      document.getElementById('sec-completed').innerHTML = section('✅ Completed', completed, renderDoneCard);
      document.getElementById('sec-ignored-content').innerHTML = section('', ignored, renderIgnoredCard);
      renderNotes();

      // Event log
      const lc = document.getElementById('events-log');
      if (events.length) lc.innerHTML = '<h3>📜 Event Log (last 20)</h3>' + events.slice(-20).reverse().map(e=>`<div class="event-row"><span class="ts">${new Date(e.ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span> <strong>${e.action}</strong> ${e.taskId}${e.note?' — '+e.note:''}</div>`).join('');
      else lc.innerHTML = '';

      // Sync status
      const unsynced = Store.readChanges({synced:0, applied:1}).length;
      const unapplied = Store.readChanges({pulled:1, applied:0}).length;
      const parts = [];
      if (unsynced) parts.push(`${unsynced} pending push`);
      if (unapplied) parts.push(`${unapplied} pending merge`);
      document.getElementById('sync-status').textContent = parts.length ? '⚡ '+parts.join(' · ') : '✓ All synced';
    }

    function withinWindow(inst, task) {
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-task.completedDays);
      return new Date(inst.updatedAt) >= cutoff;
    }

    function section(title, items, fn) {
      if (!items.length) return title ? `<h3>${title}</h3><p class="muted">Nothing here.</p>` : '<p class="muted">Nothing here.</p>';
      return (title?`<h3>${title}</h3>`:'') + items.map(fn).join('');
    }

    function renderCard({task, instance, stock, isLow, inactive}) {
      let h = `<div class="card${inactive?' inactive':''}${instance&&instance.status==='leave'?' leave':''}">`;
      h += `<div class="card-header"><strong>${task.name}</strong>`;
      if (task.type==='dependency') h += '<span class="badge badge-dep">⚡ dep</span>';
      else if (task.type==='standalone') h += '<span class="badge badge-standalone">one-time</span>';
      else {
        const bc = instance?(instance.status==='leave'?'badge-leave':'badge-pending'):(isLow?'badge-low':'badge-ok');
        const bt = instance?(instance.status==='leave'?'leave':instance.status):(isLow?'LOW':'ok');
        h += `<span class="badge ${bc}">${bt}</span>`;
      }
      h += '</div>';
      if (task.type==='dependency'&&instance&&instance.triggeredBy) {
        const tt = tasksCache.find(t=>t.id===task.config.triggerTaskId);
        h += `<div class="card-meta">⚡ Triggered by: ${tt?tt.name:task.config.triggerTaskId}</div>`;
      }
      if (instance) {
        const due = new Date(instance.dueAt);
        const hrs = Math.round((due-now())/3600000);
        h += `<div class="card-meta">Due: ${fmtDate(due)} ${fmtTime(due)} (${hrs>0?hrs+'h from now':Math.abs(hrs)+'h ago'})</div>`;
      }
      if (task.type==='quantity'&&stock) {
        const th = task.config.threshold;
        const max = Math.max(stock.qty, th*3, 10);
        const pct = Math.min((stock.qty/max)*100,100);
        h += `<div class="stock-label">Stock: <strong>${stock.qty}</strong> / threshold ${th}</div>`;
        h += `<div class="stock-bar-bg"><div class="stock-bar-fill${isLow?' low':''}" style="width:${pct}%"></div></div>`;
        if (stockInputTaskId===task.id) h += `<div class="stock-input-row"><input id="stock-qty-input" type="number" min="1" value="1" /><button onclick="confirmStock()">${stockInputAction==='consume'?'Consume':'Restock'}</button><button style="background:#e5e7eb;color:#374151" onclick="cancelStockInput()">✕</button></div>`;
        else h += `<div class="actions"><button onclick="showStockInput('${task.id}','consume')">Consume</button><button onclick="showStockInput('${task.id}','restock')">Restock</button></div>`;
      }
      if (instance && !['done','ignore'].includes(instance.status) && task.type!=='quantity') {
        const canIgnore = task.type!=='sequence' && task.type!=='quantity';
        h += '<div class="actions">';
        if (instance.status!=='leave') {
          h += `<button onclick="logAction('${instance.id}','${task.id}','will_do')">Will do</button>`;
          h += `<button onclick="logAction('${instance.id}','${task.id}','doing')">Doing</button>`;
          h += `<button class="btn-leave" onclick="logAction('${instance.id}','${task.id}','leave')">Leave</button>`;
        }
        h += `<button class="btn-done" onclick="logAction('${instance.id}','${task.id}','done')">Done</button>`;
        if (canIgnore) h += `<button class="btn-ignore" onclick="logAction('${instance.id}','${task.id}','ignore')">Ignore</button>`;
        h += '</div>';
      }
      h += '</div>';
      return h;
    }

    function renderDoneCard({task, instance}) {
      let extra = '';
      if (task.type==='dependency'&&instance.triggeredBy) {
        const tt = tasksCache.find(t=>t.id===task.config.triggerTaskId);
        extra = `<div class="card-meta">⚡ Triggered by: ${tt?tt.name:task.config.triggerTaskId}</div>`;
      }
      return `<div class="card done"><div class="card-header"><strong>${task.name}</strong><span class="badge badge-done">done</span></div>${extra}<div class="card-meta">Done: ${fmtDate(instance.updatedAt)} ${fmtTime(instance.updatedAt)}</div></div>`;
    }

    function renderIgnoredCard({task, instance}) {
      return `<div class="card ignored"><div class="card-header"><strong>${task.name}</strong><span class="badge badge-ignore">ignored</span></div><div class="card-meta">Ignored: ${fmtDate(instance.updatedAt)} ${fmtTime(instance.updatedAt)}</div></div>`;
    }

    // --- Stock ---
    window.showStockInput = function(id, a) { stockInputTaskId=id; stockInputAction=a; render(); };
    window.cancelStockInput = function() { stockInputTaskId=null; stockInputAction=null; render(); };
    window.confirmStock = function() {
      const i = document.getElementById('stock-qty-input');
      const qty = parseInt(i?i.value:'1'); if(!qty||qty<1) return;
      const taskId = stockInputTaskId, action = stockInputAction;
      stockInputTaskId=null; stockInputAction=null;
      const stock = Store.readStock(taskId);
      stock.qty += action==='restock'?qty:-qty;
      stock.events.push({action, qty, ts:now().toISOString()});
      Store.writeStock(taskId, stock);
      Store.writeEvent({ts:now().toISOString(), taskId, action, note:String(qty)});
      render();
    };

    // --- Actions ---
    window.logAction = function(instanceId, taskId, action) {
      const inst = Store.readInstances().find(i => i.id === instanceId);
      if (!inst || inst.status === 'done') return;
      inst.status = action;
      inst.updatedAt = now().toISOString();
      if (action === 'done') inst.doneAt = now().toISOString();
      Store.writeInstance(inst);

      // Advance chain on done
      if (action === 'done' && (inst.seqNumber !== undefined)) {
        const tasks = Store.readTasks();
        const task = tasks.find(t => t.id === taskId);
        if (task) {
          if (task.type==='sequence') { task.seqCounter = inst.seqNumber; Store.writeTask(task); }
          if (task.type==='quantity') { task.qtyCounter = inst.seqNumber; Store.writeTask(task); }
        }
      }

      Store.writeEvent({ts:now().toISOString(), taskId, instanceId, action, note:''});
      render();
    };

    window.logAtt = function(action) {
      Store.writeEvent({ts:now().toISOString(), taskId:'attendance', action, note:''});
      render();
    };

    // --- Pull ---
window.doPull = async function() {
  const el = document.getElementById('pull-status');
  el.textContent = '⬇ Pulling…';
  try {
    const count = await Store.syncPull();
    el.textContent = `✓ Pulled ${count} change(s)`;
  } catch (err) {
    el.textContent = `✗ ${err.message}`;
  }
  setTimeout(() => el.textContent = '', 4000);
  render();
};   

    // --- Boot ---
    render();
    setInterval(render, 60000);
  </script>
</body>
</html>
