<!DOCTYPE html>
<html lang="en">

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 0 auto; padding: 1rem; }
    h2 { margin-bottom: 1rem; }

    .type-group { margin-top: 0.75rem; padding: 0.75rem; background: #f9fafb; border-radius: 6px; border: 1px solid #e5e7eb; }
    .hidden { display: none; }
    button { padding: 0.5rem 1.2rem; background: #059669; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; margin-top: 1rem; }
    button:hover { background: #047857; }

    .task-row .info { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .task-row .badge { font-size: 0.7rem; padding: 0.15rem 0.4rem; border-radius: 3px; background: #dbeafe; color: #1e40af; }

    .btn-del { background: #fee2e2; color: #991b1b; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    a { display: inline-block; margin-top: 1rem; color: #2563eb; text-decoration: none; }
    .muted { color: #6b7280; font-size: 0.85rem; }
    .btn-row { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; align-items: center; }
    .btn-row button { margin-top: 0; padding: 0.4rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; color: #fff; }
    .btn-import { background: #2563eb; }

    .status-msg { font-size: 0.8rem; color: #059669; margin-top: 0.3rem; }

    #login-error { color: #dc2626; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #e5e7eb; margin-bottom: 1rem; }
    #sync-badge { font-size: 0.75rem; color: #0891b2; cursor: pointer; }

    #sync-panel { display: none; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.75rem; margin-bottom: 1rem; background: #f9fafb; font-size: 0.85rem; }
    #sync-panel .row { padding: 0.2rem 0; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; }
    #sync-panel .row button { padding: 0.15rem 0.4rem; font-size: 0.7rem; border: 1px solid #d1d5db; border-radius: 3px; cursor: pointer; background: #fff; }
    /* Loading spinner */
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 4px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="app" style="display:none">
  <header>

    </div>
    <button type="submit" id="submit-btn">Create Task</button>
    <button type="button" id="cancel-edit" class="hidden" style="background:#6b7280;margin-left:0.5rem" onclick="cancelEdit()">Cancel</button>
    <div id="form-status" class="status-msg"></div>

  <div class="btn-row">
    <a href="workv3.html" style="align-self:center">→ Work Log</a>
    <a href="duplicates.html" style="align-self:center">→ Duplicates</a>
    <button class="btn-save" id="btn-backup" onclick="fullBackup()">Full Backup</button>
    <button class="btn-sync" id="btn-push" onclick="pushPending()">Push Pending</button>
    <button class="btn-import" onclick="document.getElementById('import-file').click()">Import DB</button>

    <span id="import-status" class="status-msg"></span>
  </div>

  <div class="task-list" id="task-list"></div>

<script src="https://sql.js.org/dist/sql-wasm.js"></script>
<script>
const GH_OWNER = "camdevelopers";
const GH_REPO = "work3";
const API = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`;
const ENC_KEY_LEN = 64;
const TABLES = ['tasks','instances','events','notes','stock','attendance'];

let db = null, SQL = null, encKey = null, deviceId = null;

// ─── Crypto (AES-GCM, [12-byte IV][ciphertext+tag]) ─────────────────────
function hexToBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
  return bytes;
}
async function encryptData(data, keyHex) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await crypto.subtle.importKey('raw', hexToBytes(keyHex), { name: 'AES-GCM' }, false, ['encrypt']);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
  const out = new Uint8Array(12 + ct.byteLength);
  out.set(iv); out.set(new Uint8Array(ct), 12);
  return out;
}
async function decryptData(encBytes, keyHex) {
  const key = await crypto.subtle.importKey('raw', hexToBytes(keyHex), { name: 'AES-GCM' }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: encBytes.slice(0, 12) }, key, encBytes.slice(12));
  return new Uint8Array(pt);
}

// ─── IndexedDB (persists SQLite blob) ───────────────────────────────────
function idbOpen() {
  return new Promise((r, j) => { const q = indexedDB.open('office-app', 1); q.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains('data')) e.target.result.createObjectStore('data'); }; q.onsuccess = e => r(e.target.result); q.onerror = () => j(q.error); });
}
async function idbGet(key) { const d = await idbOpen(); return new Promise((r, j) => { const t = d.transaction('data', 'readonly'); const q = t.objectStore('data').get(key); q.onsuccess = () => r(q.result ?? null); q.onerror = () => j(q.error); }); }
async function idbSet(key, val) { const d = await idbOpen(); return new Promise((r, j) => { const t = d.transaction('data', 'readwrite'); t.objectStore('data').put(val, key); t.oncomplete = () => r(); t.onerror = () => j(t.error); }); }

// ─── SQLite schema ──────────────────────────────────────────────────────
const SCHEMA = `
CREATE TABLE IF NOT EXISTS tasks (
  row_id INTEGER PRIMARY KEY, task_id TEXT UNIQUE, name TEXT, type TEXT,
  tdesc TEXT, config TEXT, upcoming_hrs INTEGER, current_hrs INTEGER,
  completed_days INTEGER, created_at TEXT, synced INTEGER DEFAULT 0, is_duplicate INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS instances (
  row_id INTEGER PRIMARY KEY, instance_id TEXT UNIQUE, task_id TEXT,
  due_at TEXT, status TEXT, done_at TEXT, triggered_by TEXT,
  created_at TEXT, change_number INTEGER DEFAULT 0,
  synced INTEGER DEFAULT 0, is_duplicate INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS events (
  row_id INTEGER PRIMARY KEY, task_id TEXT, instance_id TEXT,
  action TEXT, ts TEXT, note TEXT, synced INTEGER DEFAULT 0, is_duplicate INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS notes (
  row_id INTEGER PRIMARY KEY, note_id TEXT UNIQUE, text TEXT,
  done INTEGER DEFAULT 0, created_at TEXT, edited_at TEXT,
  synced INTEGER DEFAULT 0, is_duplicate INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS stock (
  row_id INTEGER PRIMARY KEY, task_id TEXT, event TEXT,
  qty INTEGER, ts TEXT, synced INTEGER DEFAULT 0, is_duplicate INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS attendance (
  row_id INTEGER PRIMARY KEY, date TEXT, checkin TEXT, checkout TEXT,
  seq INTEGER, synced INTEGER DEFAULT 0, is_duplicate INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS oplog (
  log_id INTEGER PRIMARY KEY,
  table_name TEXT,
  record_id INTEGER,
  op TEXT,
  payload TEXT,
  ts TEXT,
  synced INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS meta (
  key TEXT PRIMARY KEY, value TEXT
);
`;

async function initDB() {
  SQL = await initSqlJs({ locateFile: () => 'https://sql.js.org/dist/sql-wasm.wasm' });
  const saved = await idbGet('db_blob');
  if (saved) {
    db = new SQL.Database(new Uint8Array(saved));
  } else {
    db = new SQL.Database();
    db.run(SCHEMA);
    const devId = parseInt(localStorage.getItem('fe_device_id')) || 1;
    db.run(`INSERT INTO meta VALUES ('next_row_id', ?)`, [String(devId * 1000000 + 1)]);
    await saveDB();
  }
}

async function saveDB() {
  const data = db.export();
  await idbSet('db_blob', data.buffer);
}

// Row IDs encode device: device 1 → 1xxxxxx, device 2 → 2xxxxxx
function nextRowId() {
  const res = db.exec(`SELECT value FROM meta WHERE key='next_row_id'`);
  let id;
  if (res.length > 0 && res[0].values.length > 0) {
    id = parseInt(res[0].values[0][0]);
  } else {
    const devId = parseInt(localStorage.getItem('fe_device_id')) || 1;
    id = devId * 1000000 + 1;
  }
  db.run(`INSERT OR REPLACE INTO meta VALUES ('next_row_id', ?)`, [String(id + 1)]);
  return id;
}

// After full backup pull, recompute next_row_id from this device's own max
function recomputeNextRowId_old() {
  const devId = parseInt(localStorage.getItem('fe_device_id')) || 1;
  const lo = devId * 1000000, hi = (devId + 1) * 1000000;
  let maxId = 0;
  for (const t of [...TABLES, 'oplog']) {
    const res = db.exec(`SELECT COALESCE(MAX(row_id),0) FROM ${t} WHERE row_id >= ${lo} AND row_id < ${hi}`);
    if (res.length > 0 && res[0].values.length > 0) maxId = Math.max(maxId, parseInt(res[0].values[0][0]) || 0);
  }
  const next = maxId > 0 ? maxId + 1 : lo + 1;
  db.run(`INSERT OR REPLACE INTO meta VALUES ('next_row_id', ?)`, [String(next)]);
}

function recomputeNextRowId() {
  const devId = parseInt(localStorage.getItem('fe_device_id')) || 1;
  const lo = devId * 1000000, hi = (devId + 1) * 1000000;
  let maxId = 0;
  for (const t of TABLES) {
    const res = db.exec(`SELECT COALESCE(MAX(row_id),0) FROM ${t} WHERE row_id >= ${lo} AND row_id < ${hi}`);
    if (res.length > 0 && res[0].values.length > 0) maxId = Math.max(maxId, parseInt(res[0].values[0][0]) || 0);
  }
  // oplog uses log_id, not row_id
  const opRes = db.exec(`SELECT COALESCE(MAX(log_id),0) FROM oplog WHERE log_id >= ${lo} AND log_id < ${hi}`);
  if (opRes.length > 0 && opRes[0].values.length > 0) maxId = Math.max(maxId, parseInt(opRes[0].values[0][0]) || 0);
  const next = maxId > 0 ? maxId + 1 : lo + 1;
  db.run(`INSERT OR REPLACE INTO meta VALUES ('next_row_id', ?)`, [String(next)]);
}   

function getMeta(key) {
  const res = db.exec(`SELECT value FROM meta WHERE key=?`, [key]);
  return res.length > 0 && res[0].values.length > 0 ? res[0].values[0][0] : null;
}
function setMeta(key, val) {
  db.run(`INSERT OR REPLACE INTO meta VALUES (?, ?)`, [key, val]);
}

// ─── Oplog: log a local change for sync ─────────────────────────────────
function logOp(tableName, recordId, op, payloadObj) {
  const logId = nextRowId();
  const ts = new Date().toISOString();
  const payload = payloadObj ? JSON.stringify(payloadObj) : null;
  db.run(`INSERT INTO oplog (log_id, table_name, record_id, op, payload, ts, synced) VALUES (?,?,?,?,?,?,0)`,
    [logId, tableName, recordId, op, payload, ts]);
  return logId;
}

// ─── Git API ────────────────────────────────────────────────────────────
function authHeaders() {
  const pat = localStorage.getItem('fe_token');
  return { 'Authorization': `Bearer ${pat}`, 'Accept': 'application/vnd.github.v3+json', 'User-Agent': 'office-pwa' };
}
async function getLatestSHA_oldway_consumemoretraffic() {
  const res = await fetch(`${API}/commits/HEAD`, { headers: authHeaders() });
  if (res.status === 409) return null;
  if (!res.ok) throw new Error(`HEAD ${res.status}`);
  return (await res.json()).sha;
}
async function getLatestSHA() {
  const headers = authHeaders();
  const etag = getMeta('last_head_etag');
  if (etag) headers['If-None-Match'] = etag;
  const res = await fetch(`${API}/commits/HEAD`, { headers });
  if (res.status === 304) return null; // unchanged, skip everything
  if (res.status === 409) return null;
  if (!res.ok) throw new Error(`HEAD ${res.status}`);
  const sha = (await res.json()).sha;
  setMeta('last_head_etag', res.headers.get('ETag'));
  return sha;
}   
async function listDir(path) {
  const res = await fetch(`${API}/contents/${path}?ref=HEAD`, { headers: authHeaders() });
  if (res.status === 404) return [];
  if (!res.ok) throw new Error(`List ${path}: ${res.status}`);
  const files = await res.json();
  return files.filter(f => f.name.endsWith('.csv') || f.name.endsWith('.enc')).map(f => f.name);
}
async function fetchFileBytes(path) {
  const res = await fetch(`${API}/contents/${path}?ref=HEAD`, { headers: authHeaders() });
  if (!res.ok) throw new Error(`Fetch ${path}: ${res.status}`);
  const data = await res.json();
  return Uint8Array.from(atob(data.content), c => c.charCodeAt(0));
}

// Push with SHA check (handles existing files) + ghost push detection
async function pushFile(path, content, message) {
  const pat = localStorage.getItem('fe_token');
  let body;
  if (typeof content === 'string') {
    body = btoa(unescape(encodeURIComponent(content)));
  } else {
    let binary = '';
    for (let i = 0; i < content.length; i++) binary += String.fromCharCode(content[i]);
    body = btoa(binary);
  }
  // Fetch existing sha if file already exists
  let sha = null;
  try {
    const checkRes = await fetch(`${API}/contents/${path}?ref=HEAD`, { headers: authHeaders() });
    if (checkRes.ok) { const data = await checkRes.json(); sha = data.sha; }
  } catch (e) {}
  const payload = { message, content: body };
  if (sha) payload.sha = sha;
  const res = await fetch(`${API}/contents/${path}`, {
    method: 'PUT',
    headers: { 'Authorization': `Bearer ${pat}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json', 'User-Agent': 'office-pwa' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    // Ghost push: file may have been written despite error. Verify.
    try {
      const verify = await fetch(`${API}/contents/${path}?ref=HEAD`, { headers: authHeaders() });
      if (verify.ok) return; // file exists, treat as success
    } catch (e) {}
    const err = await res.json().catch(() => ({}));
    throw new Error(`Push ${path}: ${res.status} ${err.message || ''}`);
  }
}

// ─── Loading indicator helper ───────────────────────────────────────────
function withSpinner(btnId, fn) {
  const btn = document.getElementById(btnId);
  if (!btn) return fn();
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  return fn().finally(() => { btn.disabled = false; btn.innerHTML = orig; });
}



// ─── Ensure repo is ready (initial commit + first backup) ───────────────
async function ensureRepoReady() {
  // 1. If repo has no commits, push a .gitkeep to create one
  const headRes = await fetch(`${API}/commits/HEAD`, { headers: authHeaders() });
  if (headRes.status === 409) {
    await pushFile('README.md', '# work3 sync repo', 'init');
  }

  // 2. If no backup exists in repo and local DB has data, push one
  const bakFiles = await listDir('backup');
  if (!bakFiles.includes('office.sqlite.enc')) {
    const hasData = db.exec(`SELECT COUNT(*) FROM tasks`).length > 0
      && db.exec(`SELECT COUNT(*) FROM tasks`)[0].values[0][0] > 0;
    if (hasData) {
      const blob = db.export();
      const encrypted = await encryptData(blob, encKey);
      await pushFile('backup/office.sqlite.enc', encrypted, 'initial backup');
      const sha = await getLatestSHA();
      setMeta('last_backup_sha', sha || '');
      await saveDB();
    }
  }
}   

// ─── Sync: Push pending oplog entries ───────────────────────────────────
async function pushPending() {
  const res = db.exec(`SELECT log_id FROM oplog WHERE synced=0 ORDER BY log_id`);
  if (res.length === 0 || res[0].values.length === 0) { updateSyncBadge(); return 0; }
  let pushed = 0;
  for (const [logId] of res[0].values) {
    try {
      const rowRes = db.exec(`SELECT * FROM oplog WHERE log_id=?`, [logId]);
      const vals = rowRes[0].values[0];
      const csvLine = vals.join('|');
      const encrypted = await encryptData(new TextEncoder().encode(csvLine), encKey);
      await pushFile(`changes/${logId}.csv`, encrypted, `op ${logId}`);
      db.run(`UPDATE oplog SET synced=1 WHERE log_id=?`, [logId]);
      pushed++;
    } catch (e) {
      console.error(`Push oplog ${logId} failed:`, e);
      break;
    }
  }
  if (pushed > 0) await saveDB();
  updateSyncBadge();
  return pushed;
}

// ─── Sync: Full backup ──────────────────────────────────────────────────
async function fullBackup() {
  const blob = db.export();
  const encrypted = await encryptData(blob, encKey);
  await pushFile('backup/office.sqlite.enc', encrypted, 'full backup');
  const sha = await getLatestSHA();
  setMeta('last_backup_sha', sha || '');
  await saveDB();
  document.getElementById('import-status').textContent = '✓ Full backup pushed';
  setTimeout(() => document.getElementById('import-status').textContent = '', 4000);
}

// ─── Sync: Pull (full backup or deltas) ─────────────────────────────────
async function doPull() {
  const localSHA = getMeta('last_pull_sha') || '';
  const remoteSHA = await getLatestSHA();
  if (!remoteSHA || remoteSHA === localSHA) return 0;

  let applied = 0;

  // Full backup check
  try {
    const bakFiles = await listDir('backup');
    if (bakFiles.includes('office.sqlite.enc')) {
      const lastBak = getMeta('last_backup_sha') || '';
      if (remoteSHA !== lastBak) {
        const encBytes = await fetchFileBytes('backup/office.sqlite.enc');
        const decrypted = await decryptData(encBytes, encKey);
        db = new SQL.Database(decrypted);
        // Recompute row ID counter for this device after loading foreign DB
        recomputeNextRowId();
        setMeta('last_pull_sha', remoteSHA);
        setMeta('last_backup_sha', remoteSHA);
        await saveDB();
        return -1; // full reset
      }
    }
  } catch (e) { console.warn('Backup pull:', e); }

  // Delta pull: replay oplog entries
  try {
    const files = await listDir('changes');
    for (const f of files) {
      if (!f.endsWith('.csv')) continue;
      const logId = parseInt(f.replace('.csv', ''));
      const exists = db.exec(`SELECT 1 FROM oplog WHERE log_id=?`, [logId]);
      if (exists.length > 0 && exists[0].values.length > 0) continue;

      const encBytes = await fetchFileBytes(`changes/${f}`);
      const decrypted = await decryptData(encBytes, encKey);
      const line = new TextDecoder().decode(decrypted);
      const fields = line.split('|');
      // oplog columns: log_id|table_name|record_id|op|payload|ts|synced
      const tbl = fields[1], recId = parseInt(fields[2]), op = fields[3], payloadJson = fields[4];

      // Store in local oplog (prevents re-replay)
      db.run(`INSERT OR IGNORE INTO oplog (log_id, table_name, record_id, op, payload, ts, synced) VALUES (?,?,?,?,?,?,1)`,
        [logId, tbl, recId, op, payloadJson, fields[5]]);

      // Replay the operation
      if (TABLES.includes(tbl)) {
        try {
          if (op === 'INSERT' || op === 'UPDATE') {
            const row = JSON.parse(payloadJson);
            const cols = Object.keys(row);
            const vals = cols.map(c => row[c] === undefined ? null : row[c]);
            const colList = cols.join(',');
            const placeholders = cols.map(() => '?').join(',');
            if (op === 'INSERT') {
              db.run(`INSERT OR IGNORE INTO ${tbl} (${colList}) VALUES (${placeholders})`, vals);
            } else {
              const setCols = cols.filter(c => c !== 'row_id');
              const setClause = setCols.map(c => `${c}=?`).join(',');
              const setVals = setCols.map(c => row[c] === undefined ? null : row[c]);
              db.run(`UPDATE ${tbl} SET ${setClause} WHERE row_id=?`, [...setVals, row.row_id]);
            }
            applied++;
          } else if (op === 'DELETE') {
            db.run(`DELETE FROM ${tbl} WHERE row_id=?`, [recId]);
            applied++;
          }
        } catch (e) { console.warn(`Replay ${logId} (${op} ${tbl}):`, e); }
      }
    }
  } catch (e) { console.warn('Delta pull:', e); }

  setMeta('last_pull_sha', remoteSHA);
  await saveDB();

  // Dedup sweep: after pull, resolve any duplicate instances
  runDedupSweep();
  return applied;
}

// ─── Dedup sweep: after pull, resolve any duplicate instances ───────────
// For each task, find pending instances that overlap (same slot relative to latest done_at).
// Higher change_number wins; tie → earlier created_at wins. Loser gets is_duplicate=1.
function runDedupSweep() {
  const tasks = getTasks();
  const instances = getInstances();
  let changed = false;

  for (const task of tasks) {
    const cfg = JSON.parse(task.config || '{}');
    const taskInsts = instances.filter(i => i.task_id === task.task_id && i.is_duplicate === 0);
    const pending = taskInsts.filter(i => i.status === 'pending' || i.status === 'doing' || i.status === 'will_do');
    if (pending.length <= 1) continue;

    // Find the latest done_at for this task (anchor)
    const doneInsts = taskInsts.filter(i => i.status === 'done' && i.done_at);
    const lastDone = doneInsts.length > 0
      ? doneInsts.sort((a, b) => new Date(b.done_at) - new Date(a.done_at))[0]
      : null;

    // Group pending instances by "slot"
    const slots = {};
    for (const inst of pending) {
      let slotKey;
      if (task.type === 'sequence') {
        // Slot = which interval after lastDone (or "first" if no done)
        if (!lastDone) {
          slotKey = 'first';
        } else {
          const intervalMs = cfg.unit === 'hours' ? cfg.n * 3600000 : cfg.n * 86400000;
          const diff = new Date(inst.due_at) - new Date(lastDone.done_at);
          const slotIdx = Math.floor(diff / intervalMs);
          slotKey = `slot-${slotIdx}`;
        }
      } else if (task.type === 'calendar') {
        slotKey = new Date(inst.due_at).toISOString().slice(0, 10);
      } else if (task.type === 'dependency') {
        slotKey = inst.triggered_by || 'unknown';
      } else {
        slotKey = 'single';
      }
      if (!slots[slotKey]) slots[slotKey] = [];
      slots[slotKey].push(inst);
    }

    // For each slot with multiple instances, keep the winner
    for (const key of Object.keys(slots)) {
      const group = slots[key];
      if (group.length <= 1) continue;
      // Sort by change_number DESC, then created_at ASC
      group.sort((a, b) => {
        if (b.change_number !== a.change_number) return b.change_number - a.change_number;
        return new Date(a.created_at) - new Date(b.created_at);
      });
      // First is winner, rest are duplicates
      for (let i = 1; i < group.length; i++) {
        db.run(`UPDATE instances SET is_duplicate=1 WHERE row_id=?`, [group[i].row_id]);
        changed = true;
      }
    }
  }

  if (changed) saveDB();
}

// ─── Sync UI ────────────────────────────────────────────────────────────
function updateSyncBadge() {
  let total = 0;
  try {
    const res = db.exec(`SELECT COUNT(*) FROM oplog WHERE synced=0`);
    if (res.length > 0 && res[0].values.length > 0) total = res[0].values[0][0];
  } catch (e) {}
  document.getElementById('sync-count').textContent = total;
  document.getElementById('sync-badge').classList.toggle('has-pending', total > 0);
}

window.toggleSyncPanel = function() {
  const panel = document.getElementById('sync-panel');
  if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  const res = db.exec(`SELECT log_id, table_name, op, ts FROM oplog WHERE synced=0 ORDER BY log_id LIMIT 20`);
  let html = '<strong>Sync Status</strong>';
  if (res.length > 0 && res[0].values.length > 0) {
    for (const [lid, tbl, op, ts] of res[0].values) {
      html += `<div class="row"><span>${lid} ${op} ${tbl} ${ts}</span><button onclick="pushSingle(${lid})">push</button></div>`;
    }
  } else {
    html += '<p class="muted">All synced ✓</p>';
  }
  html += `<div style="margin-top:0.5rem"><button onclick="withSpinner('btn-push', pushPending).then(()=>{toggleSyncPanel();toggleSyncPanel()})" style="padding:0.2rem 0.6rem;font-size:0.75rem;background:#0891b2;color:#fff;border:none;border-radius:3px;cursor:pointer">Push All</button></div>`;
  panel.innerHTML = html;
};

window.pushSingle = async function(logId) {
  const rowRes = db.exec(`SELECT * FROM oplog WHERE log_id=?`, [logId]);
  if (!rowRes.length || !rowRes[0].values.length) return;
  const vals = rowRes[0].values[0];
  const csvLine = vals.join('|');
  const encrypted = await encryptData(new TextEncoder().encode(csvLine), encKey);
  await pushFile(`changes/${logId}.csv`, encrypted, `op ${logId}`);
  db.run(`UPDATE oplog SET synced=1 WHERE log_id=?`, [logId]);
  await saveDB();
  updateSyncBadge();
  toggleSyncPanel(); toggleSyncPanel();
};

// ─── Data helpers ───────────────────────────────────────────────────────
function getTasks() {
  const res = db.exec(`SELECT * FROM tasks WHERE is_duplicate=0 ORDER BY name`);
  if (res.length === 0) return [];
  const cols = res[0].columns;
  return res[0].values.map(v => Object.fromEntries(cols.map((c, i) => [c, v[i]])));
}
function getInstances() {
  const res = db.exec(`SELECT * FROM instances ORDER BY due_at`);
  if (res.length === 0) return [];
  const cols = res[0].columns;
  return res[0].values.map(v => Object.fromEntries(cols.map((c, i) => [c, v[i]])));
}

// ─── Login ──────────────────────────────────────────────────────────────
document.getElementById('loginBtn').addEventListener('click', async () => {
  const name = document.getElementById('loginName').value.trim();
  const token = document.getElementById('loginToken').value.trim();
  const err = document.getElementById('login-error');
  if (!name || !token) { err.textContent = 'Both fields required.'; err.style.display = 'block'; return; }
  if (token.length < ENC_KEY_LEN + 36) { err.textContent = 'Token too short. Expected PAT + 64-char key.'; err.style.display = 'block'; return; }
  encKey = token.slice(-ENC_KEY_LEN);
  const pat = token.slice(0, -ENC_KEY_LEN);
  try {
    const res = await fetch('https://api.github.com/user', { headers: { 'Authorization': `Bearer ${pat}`, 'User-Agent': 'office-pwa' } });
    if (!res.ok) throw new Error();
  } catch { err.textContent = 'Invalid PAT.'; err.style.display = 'block'; return; }
  localStorage.setItem('fe_token', pat);
  localStorage.setItem('fe_user', name);
  localStorage.setItem('fe_enc_key', encKey);
  if (!localStorage.getItem('fe_device_id')) {
    const d = prompt('Device number (1=PC, 2=mobile):', '1');
    localStorage.setItem('fe_device_id', String(parseInt(d) || 1));
  }
  deviceId = parseInt(localStorage.getItem('fe_device_id')) || 1;
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('userLabel').textContent = name;
  await startApp();
});

// ─── App boot ───────────────────────────────────────────────────────────
async function startApp() {
  await initDB();
  encKey = localStorage.getItem('fe_enc_key');
  deviceId = parseInt(localStorage.getItem('fe_device_id')) || 1;
  await ensureRepoReady();   // ← this one line
  await doPull();
  await pushPending();
  updateSyncBadge();
  renderList();
  //setInterval(async () => { await doPull(); renderList(); updateSyncBadge(); }, 60000);
let lastBgPull = 0;
setInterval(async () => {
  if (document.hidden) {
    const now = Date.now();
    if (now - lastBgPull < 1800000) return; // 30 min
    lastBgPull = now;
  }
  await doPull(); renderList(); updateSyncBadge();
}, 60000);   

// Immediate pull on regaining focus
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden) { await doPull(); renderList(); updateSyncBadge(); }
});
}

// ─── Task list render ───────────────────────────────────────────────────
function renderList() {
  const tasks = getTasks();
  const container = document.getElementById('task-list');
  if (tasks.length === 0) { container.innerHTML = '<h3>Existing Tasks</h3><p class="muted">No tasks yet.</p>'; return; }
  container.innerHTML = '<h3>Existing Tasks</h3>' + tasks.map(t => {
    let extra = '';
    const cfg = JSON.parse(t.config || '{}');
    if (t.type === 'dependency' && cfg.triggerTaskId) {
      const trigger = tasks.find(x => x.task_id === cfg.triggerTaskId);
      extra = `<span class="muted" style="font-size:0.7rem">⚡ after: ${trigger ? trigger.name : cfg.triggerTaskId} + ${cfg.delay || 0} ${cfg.delayUnit || 'h'}</span>`;
    }
    return `<div class="task-row">
      <div class="info"><strong>${t.name}</strong><span class="badge">${t.type}</span><span class="muted">${t.tdesc}</span>${extra}<span class="muted" style="font-size:0.7rem">up:${t.upcoming_hrs}h cur:${t.current_hrs}h done:${t.completed_days}d</span></div>
      <div style="display:flex;gap:0.3rem"><button class="btn-edit" onclick="editTask('${t.task_id}')">Edit</button><button class="btn-del" onclick="delTask('${t.task_id}')">Del</button></div>
    </div>`;
  }).join('');
}

// ─── Task edit (PC only, triggers full backup on save) ──────────────────
window.editTask = function(taskId) {
  const task = getTasks().find(t => t.task_id === taskId);
  if (!task) return;
  document.getElementById('edit-task-id').value = taskId;
  document.getElementById('tc-name').value = task.name;
  document.getElementById('tc-type').value = task.type;
  const cfg = JSON.parse(task.config || '{}');
  if (task.type === 'sequence') { document.getElementById('seq-n').value = cfg.n || 1; document.getElementById('seq-unit').value = cfg.unit || 'days'; }
  if (task.type === 'calendar') { document.getElementById('cal-day').value = cfg.day || 1; document.getElementById('cal-repeat').value = cfg.repeat || 'monthly'; }
  if (task.type === 'quantity') { document.getElementById('qty-threshold').value = cfg.threshold || 0; document.getElementById('qty-initial').value = cfg.initial || 0; }
  if (task.type === 'standalone' && cfg.deadline) { document.getElementById('standalone-deadline').value = cfg.deadline; }
  if (task.type === 'dependency') { populateTriggerSelect(); document.getElementById('dep-trigger').value = cfg.triggerTaskId || ''; document.getElementById('dep-delay').value = cfg.delay || 0; document.getElementById('dep-delay-unit').value = cfg.delayUnit || 'hours'; }
  document.getElementById('tc-upcoming-hrs').value = task.upcoming_hrs;
  document.getElementById('tc-current-hrs').value = task.current_hrs;
  document.getElementById('tc-completed-days').value = task.completed_days;
  document.getElementById('form-title').textContent = 'Edit Task';
  document.getElementById('submit-btn').textContent = 'Save Changes';
  document.getElementById('cancel-edit').classList.remove('hidden');
  updateGroups();
  document.getElementById('task-form').scrollIntoView({ behavior: 'smooth' });
};

window.cancelEdit = function() {
  document.getElementById('task-form').reset();
  document.getElementById('edit-task-id').value = '';
  document.getElementById('form-title').textContent = 'Create Task';
  document.getElementById('submit-btn').textContent = 'Create Task';
  document.getElementById('cancel-edit').classList.add('hidden');
  updateGroups();
};

// ─── Task delete ────────────────────────────────────────────────────────
window.delTask = function(taskId) {
  if (!confirm('Delete this task and all its data?')) return;
  const taskRes = db.exec(`SELECT row_id FROM tasks WHERE task_id=?`, [taskId]);
  if (taskRes.length === 0 || taskRes[0].values.length === 0) return;
  const rowId = taskRes[0].values[0][0];
  db.run(`DELETE FROM tasks WHERE task_id=?`, [taskId]);
  db.run(`DELETE FROM instances WHERE task_id=?`, [taskId]);
  db.run(`DELETE FROM events WHERE task_id=?`, [taskId]);
  db.run(`DELETE FROM stock WHERE task_id=?`, [taskId]);
  logOp('tasks', rowId, 'DELETE', null);
  saveDB().then(() => pushPending());
  renderList();
};

// ─── Form (create or edit) ──────────────────────────────────────────────
const typeSelect = document.getElementById('tc-type');
const groups = { sequence: 'g-seq', calendar: 'g-cal', quantity: 'g-qty', standalone: 'g-standalone', dependency: 'g-dep', attendance: 'g-att' };
function updateGroups() {
  for (const [type, id] of Object.entries(groups)) document.getElementById(id).classList.toggle('hidden', typeSelect.value !== type);
  if (typeSelect.value === 'dependency') populateTriggerSelect();
}
typeSelect.addEventListener('change', updateGroups);
updateGroups();

function populateTriggerSelect() {
  const sel = document.getElementById('dep-trigger');
  const editingId = document.getElementById('edit-task-id').value;
  const tasks = getTasks().filter(t => t.type !== 'dependency' && t.type !== 'attendance' && t.task_id !== editingId);
  sel.innerHTML = '<option value="">— select trigger —</option>' + tasks.map(t => `<option value="${t.task_id}">${t.name} (${t.type})</option>`).join('');
}

document.getElementById('task-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const editId = document.getElementById('edit-task-id').value;
  const name = document.getElementById('tc-name').value.trim();
  const type = typeSelect.value;
  const upcomingHrs = parseInt(document.getElementById('tc-upcoming-hrs').value) || 72;
  const currentHrs = parseInt(document.getElementById('tc-current-hrs').value) || 24;
  const completedDays = parseInt(document.getElementById('tc-completed-days').value) || 7;
  let desc = '', config = {};
  if (type === 'sequence') {
    const n = parseInt(document.getElementById('seq-n').value) || 1;
    const unit = document.getElementById('seq-unit').value;
    desc = `every ${n} ${unit}`; config = { n, unit };
  } else if (type === 'calendar') {
    const day = parseInt(document.getElementById('cal-day').value) || 1;
    const repeat = document.getElementById('cal-repeat').value;
    desc = `day ${day}, ${repeat}`; config = { day, repeat };
  } else if (type === 'quantity') {
    const threshold = parseInt(document.getElementById('qty-threshold').value) || 0;
    const initial = parseInt(document.getElementById('qty-initial').value) || 0;
    desc = `threshold ${threshold}, initial ${initial}`; config = { threshold, initial };
  } else if (type === 'standalone') {
    const deadline = document.getElementById('standalone-deadline').value;
    desc = deadline ? `due ${new Date(deadline).toLocaleString('en-IN')}` : 'due now'; config = { deadline: deadline || null };
  } else if (type === 'dependency') {
    const triggerTaskId = document.getElementById('dep-trigger').value;
    if (!triggerTaskId) { document.getElementById('form-status').textContent = '⚠️ Select trigger'; return; }
    const delay = parseInt(document.getElementById('dep-delay').value) || 0;
    const delayUnit = document.getElementById('dep-delay-unit').value;
    desc = `after trigger + ${delay} ${delayUnit}`; config = { triggerTaskId, delay, delayUnit };
  } else if (type === 'attendance') {
    desc = 'daily check-in/out'; config = {};
  }

  const now = new Date().toISOString();

  if (editId) {
    // EDIT: update existing task, trigger full backup
    const taskId = editId;
    db.run(`UPDATE tasks SET name=?, type=?, tdesc=?, config=?, upcoming_hrs=?, current_hrs=?, completed_days=? WHERE task_id=?`,
      [name, type, desc, JSON.stringify(config), upcomingHrs, currentHrs, completedDays, taskId]);
    const taskRes = db.exec(`SELECT * FROM tasks WHERE task_id=?`, [taskId]);
    const cols = taskRes[0].columns;
    const row = Object.fromEntries(cols.map((c, i) => [c, taskRes[0].values[0][i]]));
    logOp('tasks', row.row_id, 'UPDATE', row);
    await saveDB();
    // Full backup instead of deltas (config change may invalidate instances)
    await withSpinner('btn-backup', fullBackup);
    document.getElementById('form-status').textContent = `✓ "${name}" updated (full backup pushed)`;
    cancelEdit();
  } else {
    // CREATE: insert new task
    const taskId = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const rowId = nextRowId();
    db.run(`INSERT INTO tasks (row_id,task_id,name,type,tdesc,config,upcoming_hrs,current_hrs,completed_days,created_at,synced,is_duplicate) VALUES (?,?,?,?,?,?,?,?,?,?,0,0)`,
      [rowId, taskId, name, type, desc, JSON.stringify(config), upcomingHrs, currentHrs, completedDays, now]);
    logOp('tasks', rowId, 'INSERT', { row_id: rowId, task_id: taskId, name, type, tdesc: desc, config: JSON.stringify(config), upcoming_hrs: upcomingHrs, current_hrs: currentHrs, completed_days: completedDays, created_at: now, synced: 0, is_duplicate: 0 });

    if (type === 'quantity' && config.initial > 0) {
      const sRow = nextRowId();
      db.run(`INSERT INTO stock (row_id,task_id,event,qty,ts,synced,is_duplicate) VALUES (?,?,?,?,?,0,0)`, [sRow, taskId, 'restock', config.initial, now]);
      logOp('stock', sRow, 'INSERT', { row_id: sRow, task_id: taskId, event: 'restock', qty: config.initial, ts: now, synced: 0, is_duplicate: 0 });
    }
    if (type === 'standalone') {
      const iRow = nextRowId();
      const dueAt = config.deadline ? new Date(config.deadline).toISOString() : now;
      db.run(`INSERT INTO instances (row_id,instance_id,task_id,due_at,status,done_at,triggered_by,created_at,change_number,synced,is_duplicate) VALUES (?,?,?,?, 'pending', NULL, NULL, ?,0,0,0)`,
        [iRow, `${taskId}-0001`, taskId, dueAt, now]);
      logOp('instances', iRow, 'INSERT', { row_id: iRow, instance_id: `${taskId}-0001`, task_id: taskId, due_at: dueAt, status: 'pending', done_at: null, triggered_by: null, created_at: now, change_number: 0, synced: 0, is_duplicate: 0 });
    }
    await saveDB();
    await withSpinner('btn-push', pushPending);
    document.getElementById('form-status').textContent = `✓ "${name}" created`;
    e.target.reset();
    updateGroups();
  }
  setTimeout(() => document.getElementById('form-status').textContent = '', 3000);
  renderList();
});

// ─── Import DB ──────────────────────────────────────────────────────────
window.importDB = function(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      let bytes = new Uint8Array(e.target.result);
      if (file.name.endsWith('.enc')) bytes = await decryptData(bytes, encKey);
      db = new SQL.Database(bytes);
      recomputeNextRowId();
      await saveDB();
      document.getElementById('import-status').textContent = '✓ DB loaded';
      setTimeout(() => document.getElementById('import-status').textContent = '', 4000);
      renderList();
      updateSyncBadge();
    } catch (err) {
      document.getElementById('import-status').textContent = '✗ ' + err.message;
    }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
};

// ─── Boot ───────────────────────────────────────────────────────────────
(async () => {
  const pat = localStorage.getItem('fe_token');
  const user = localStorage.getItem('fe_user');
  encKey = localStorage.getItem('fe_enc_key');
  if (pat && user && encKey) {
    deviceId = parseInt(localStorage.getItem('fe_device_id')) || 1;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = '';
    document.getElementById('userLabel').textContent = user;
    await startApp();
  }
})();
