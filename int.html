<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>My Workspace</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1.5rem;
    }

    .header {
      text-align: center;
      color: #fff;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 700;
    }

    .header p {
      margin-top: 0.4rem;
      font-size: 0.95rem;
      opacity: 0.8;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      width: 100%;
      max-width: 420px;
    }

    @media (min-width: 768px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
        max-width: 1200px;
      }
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem 1.25rem;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 1.25rem;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.2);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .card-icon {
      width: 2.5rem;
      height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.2);
      border-radius: 0.7rem;
      font-size: 1.2rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    /* --- Small pill links --- */
    .pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
    }

    .pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 32px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      transition: background 0.15s, transform 0.15s;
    }

    .pill:hover, .pill:focus {
      background: rgba(255,255,255,0.35);
      transform: scale(1.05);
    }

    /* Evenly space when on one row (desktop) */
    @media (min-width: 768px) {
      .pills {
        flex-wrap: nowrap;
        justify-content: space-evenly;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>My Workspace</h1>
    <p>Quick access to your tools</p>
  </div>

  <nav class="cards">

    <div class="card">
      <div class="card-header">
        <div class="card-icon">💰</div>
        <span class="card-title">Expenses</span>
      </div>
      <div class="pills">
        <a href="expenses/daily.html" class="pill">Daily</a>
        <a href="expenses/monthly.html" class="pill">Monthly</a>
        <a href="expenses/reports.html" class="pill">Reports</a>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">💼</div>
        <span class="card-title">Work</span>
      </div>
      <div class="pills">
        <a href="office/tasks.html" class="pill">Tasks</a>
        <a href="office/meetings.html" class="pill">Meetings</a>
        <a href="office/notes.html" class="pill">Notes</a>
        <a href="office/reviews.html" class="pill">Reviews</a>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">🧾</div>
        <span class="card-title">Fees</span>
      </div>
      <div class="pills">
        <a href="fee/collect.html" class="pill">Collect</a>
        <a href="fee/history.html" class="pill">History</a>
        <a href="fee/reminders.html" class="pill">Reminders</a>
        <a href="fee/stats.html" class="pill">Stats</a>
        <a href="fee/settings.html" class="pill">Settings</a>
      </div>
    </div>

  </nav>

</body>
</html>
